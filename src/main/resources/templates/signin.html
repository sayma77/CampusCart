<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout :: head}">
    <title>Sign In - CampusCart</title>
  </head>
  <body th:replace="~{layout :: layout}">
    <main
      class="min-h-screen flex items-center justify-center bg-gradient-to-br from-background-light to-primary-50 dark:from-background-dark dark:to-surface-dark py-12"
    >
      <div class="w-full max-w-4xl mx-auto px-4">
        <div
          class="bg-white dark:bg-surface-dark rounded-2xl shadow-2xl overflow-hidden border border-primary-100/20 dark:border-accent/20"
        >
          <div class="grid grid-cols-1 lg:grid-cols-2">
            <!-- Sign In Form -->
            <div class="p-8 lg:p-12">
              <div class="text-center mb-8">
                <!-- <div class="flex items-center justify-center mb-4"> -->
                <!-- <i
                    data-lucide="package"
                    class="h-10 w-10 text-primary mr-2"
                  ></i> -->
                <!-- <span class="text-2xl font-bold text-primary dark:text-accent"
                    >CampusCart</span
                  >
                </div> -->
                <h2
                  class="text-3xl font-bold text-primary dark:text-primary-50 mb-2"
                >
                  Welcome Back
                </h2>
                <p class="text-primary-200 dark:text-primary-100">
                  Sign in to your account to continue
                </p>
              </div>

              <form th:action="@{/signin}" method="post" class="space-y-6">
                <!-- Email -->
                <div>
                  <label
                    class="block text-sm font-medium text-primary dark:text-primary-50 mb-2"
                    >CUET Email</label
                  >
                  <div class="relative">
                    <i
                      data-lucide="mail"
                      class="absolute left-3 top-1/2 transform -translate-y-1/2 h-5 w-5 text-primary-200"
                    ></i>
                    <input
                      type="email"
                      name="email"
                      placeholder="your.name@student.cuet.ac.bd"
                      class="w-full pl-12 pr-4 py-4 border border-primary-100 dark:border-accent/30 rounded-lg focus:ring-2 focus:ring-accent focus:border-accent bg-primary-50 dark:bg-background-dark text-primary dark:text-primary-50 transition-all duration-200"
                      required
                      pattern="^[a-zA-Z0-9._%+-]+@student\.cuet\.ac\.bd$"
                      title="Only CUET email is allowed"
                    />
                  </div>
                </div>

                <!-- Password -->
                <div>
                  <label
                    class="block text-sm font-medium text-primary dark:text-primary-50 mb-2"
                  >
                    Password
                  </label>
                  <div class="relative">
                    <!-- Lock icon -->
                    <i
                      data-lucide="lock"
                      class="absolute left-3 top-1/2 transform -translate-y-1/2 h-5 w-5 text-primary-200"
                    ></i>

                    <!-- Password input -->
                    <input
                      id="password"
                      type="password"
                      name="password"
                      placeholder="Enter your password"
                      class="w-full pl-12 pr-12 py-4 border border-primary-100 dark:border-accent/30 rounded-lg focus:ring-2 focus:ring-accent focus:border-accent bg-primary-50 dark:bg-background-dark text-primary dark:text-primary-50 transition-all duration-200"
                      required
                    />

                    <!-- Eye toggle button -->
                    <button
                      type="button"
                      id="togglePassword"
                      class="absolute right-3 top-1/2 transform -translate-y-1/2 text-primary-400 dark:text-primary-300 hover:text-primary-600 dark:hover:text-accent transition-colors duration-200 focus:outline-none hidden"
                    >
                      <!-- Eye Open -->
                      <svg
                        id="eyeOpen"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 20 20"
                        fill="currentColor"
                        class="w-5 h-5 hidden"
                      >
                        <path
                          d="M10 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"
                        />
                        <path
                          fill-rule="evenodd"
                          d="M.664 10.59a1.651 1.651 0 0 1 0-1.186A10.004 10.004 0 0 1 10 3c4.257 0 7.893 2.66 9.336 6.41.147.381.146.804 0 1.186A10.004 10.004 0 0 1 10 17c-4.257 0-7.893-2.66-9.336-6.41ZM14 10a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"
                          clip-rule="evenodd"
                        />
                      </svg>

                      <!-- Eye Closed -->
                      <svg
                        id="eyeClosed"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 20 20"
                        fill="currentColor"
                        class="w-5 h-5"
                      >
                        <path
                          fill-rule="evenodd"
                          d="M3.28 2.22a.75.75 0 0 0-1.06 1.06l14.5 14.5a.75.75 0 1 0 1.06-1.06l-1.745-1.745a10.029 10.029 0 0 0 3.3-4.38 1.651 1.651 0 0 0 0-1.185A10.004 10.004 0 0 0 9.999 3a9.956 9.956 0 0 0-4.744 1.194L3.28 2.22ZM7.752 6.69l1.092 1.092a2.5 2.5 0 0 1 3.374 3.373l1.091 1.092a4 4 0 0 0-5.557-5.557Z"
                          clip-rule="evenodd"
                        />
                        <path
                          d="m10.748 13.93 2.523 2.523a9.987 9.987 0 0 1-3.27.547c-4.258 0-7.894-2.66-9.337-6.41a1.651 1.651 0 0 1 0-1.186A10.007 10.007 0 0 1 2.839 6.02L6.07 9.252a4 4 0 0 0 4.678 4.678Z"
                        />
                      </svg>
                    </button>
                  </div>
                </div>

                <!-- Submit Button -->
                <button
                  type="submit"
                  class="w-full bg-gradient-to-r from-primary to-accent hover:from-accent hover:to-primary text-white font-bold py-4 rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl"
                >
                  <i data-lucide="log-in" class="h-5 w-5 inline mr-2"></i>
                  Sign In
                </button>

                <div
                  th:if="${param.error}"
                  class="flex items-center bg-red-50 text-red-600 px-3 py-2 rounded-md mt-4 text-sm opacity-100 transition-opacity duration-500 delay-5000"
                  style="animation: fadeOut 2s ease-out 1s forwards"
                >
                  <svg
                    class="w-4 h-4 mr-2 text-red-400 flex-shrink-0"
                    fill="currentColor"
                    viewBox="0 0 20 20"
                  >
                    <path
                      fill-rule="evenodd"
                      d="M18 10c0 4.418-3.582 8-8 8s-8-3.582-8-8 3.582-8 8-8 8 3.582 8 8zm-9 3a1 1 0 102 0 1 1 0 00-2 0zm1-8a1 1 0 00-.993.883L9 6v4a1 1 0 001.993.117L11 10V6a1 1 0 00-1-1z"
                      clip-rule="evenodd"
                    ></path>
                  </svg>
                  <span>Invalid email or password</span>
                </div>
              </form>

              <!-- Inline CSS animation -->
              <style>
                @keyframes fadeOut {
                  to {
                    opacity: 0;
                  }
                }
              </style>

              <!-- Forgot Password -->
              <!-- <div class="text-center mt-6">
                <a
                  href="/forgot-password"
                  class="text-accent hover:text-primary transition-colors duration-200 text-sm"
                >
                  Forgot your password?
                </a>
              </div> -->
            </div>

            <!-- Side Panel -->
            <div
              class="bg-gradient-to-br from-primary to-accent p-8 lg:p-12 text-white flex flex-col justify-center"
            >
              <div class="text-center">
                <i
                  data-lucide="users"
                  class="h-16 w-16 mx-auto mb-6 text-white/80"
                ></i>
                <h3 class="text-2xl font-bold mb-4">New to CampusCart?</h3>
                <p class="text-white/90 mb-8 leading-relaxed">
                  Join thousands of CUET students who are already buying,
                  selling, and trading on our platform. Create your account and
                  start exploring great deals today!
                </p>
                <a
                  href="/signup"
                  class="bg-white text-primary hover:bg-primary-50 font-bold px-8 py-4 rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl inline-block"
                >
                  Create Account
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>

<!-- JS to toggle password visibility -->
<script>
  const passwordInput = document.getElementById("password");
  const toggleBtn = document.getElementById("togglePassword");
  const eyeOpen = document.getElementById("eyeOpen");
  const eyeClosed = document.getElementById("eyeClosed");

  // Show/hide eye button depending on input value
  passwordInput.addEventListener("input", () => {
    if (passwordInput.value.length > 0) {
      toggleBtn.classList.remove("hidden");
    } else {
      toggleBtn.classList.add("hidden");
      // Reset to default state
      passwordInput.type = "password";
      eyeOpen.classList.add("hidden");
      eyeClosed.classList.remove("hidden");
    }
  });

  toggleBtn.addEventListener("click", () => {
    if (passwordInput.type === "password") {
      passwordInput.type = "text";
      eyeOpen.classList.remove("hidden");
      eyeClosed.classList.add("hidden");
    } else {
      passwordInput.type = "password";
      eyeOpen.classList.add("hidden");
      eyeClosed.classList.remove("hidden");
    }
  });
</script>
