<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout :: head}"></head>
  <body th:replace="~{layout :: layout}">
    <main>
      <section
        class="flex flex-col items-center justify-center min-h-[60vh] text-center py-20 px-4 min-h-dvh"
      >
        <div
          class="bg-gradient-to-br from-primary-50 to-accent-50 dark:from-surface-dark dark:to-background-dark rounded-3xl shadow-2xl border border-primary-100/20 dark:border-accent/20 p-12 max-w-md animate-fade-in"
        >
          <h1
            class="text-6xl md:text-7xl font-bold text-primary dark:text-primary-50 mb-4"
          >
            403
          </h1>
          <h2
            class="text-2xl font-semibold text-primary-200 dark:text-primary-100 mb-6"
          >
            Access Denied 🚫
          </h2>
          <p class="text-primary-200 dark:text-primary-100 mb-8">
            You don’t have permission to access this page.
          </p>
          <a
            href="/"
            class="bg-primary hover:bg-accent text-white px-8 py-3 rounded-xl font-semibold transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl"
          >
            Go Home
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
