    <div class="flex justify-end mb-4" th:if="${notifications != null and !notifications.isEmpty() and notifications.?[!isRead].size() > 0}">
        <a th:href="@{/notifications/read-all}" 
        class="inline-flex items-center px-4 py-2 border border-gray-300 dark:border-gray-600 text-sm font-medium rounded-md text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            Mark All as Read
        </a>
    </div>

    <!-- Notifications List -->
<div class="space-y-4" th:if="${notifications != null and !notifications.isEmpty()}">
    <div th:each="notification : ${notifications}"
         th:classappend="${notification.isRead} ? 
            ' bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700' : 
            ' bg-primary/5 dark:bg-primary/10 border-l-4 border-primary'"
         class="shadow-sm rounded-xl p-5 transition-all hover:shadow-md hover:scale-[1.01] duration-200">

        <div class="flex items-start justify-between">
            <div class="flex-1">
                <!-- Notification Message -->
                <h3 class="text-gray-900 dark:text-white font-semibold mb-1"
                    th:text="${notification.message}">
                    Notification message goes here
                </h3>
                <!-- Timestamp -->
                <p class="text-xs text-gray-500 dark:text-gray-400"
                    th:text="${#temporals.format(notification.createdAt, 'MMM dd, yyyy ''at'' HH:mm')}">
                    Jan 15, 2024 at 14:30
                </p>
            </div>

            <!-- Mark as Read -->
            <!-- <div th:if="${!notification.isRead}" class="ml-4 flex-shrink-0">
                <a th:href="@{/notifications/read/{id}(id=${notification.id})}"

                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                    </svg>
                    Mark as Read
                </a>

        </div>
    </div>
</div>

    <!-- Empty State -->
    <div th:if="${notifications == null or notifications.isEmpty()}" class="text-center py-12">
        <div class="mx-auto w-24 h-24 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center mb-4">
            <svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-5 5v-5zM9 7H4l5-5v5z"/>
            </svg>
        </div>
        <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-2">No notifications yet</h3>
        <p class="text-gray-500 dark:text-gray-400 mb-6">You have no notifications yet. When you receive notifications, they'll appear here.</p>
        <a th:href="@{/}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            Go to Homepage
        </a>
    </div>
</main>
