<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle} + ' - CampusCart Admin'">
      CampusCart Admin
    </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: "#3D52A0",
                50: "#EDE8F5",
                100: "#ADBBDA",
                200: "#8697C4",
                300: "#7091E6",
                400: "#3D52A0",
                500: "#3D52A0",
                600: "#2F4080",
                700: "#233060",
                800: "#172040",
                900: "#0B1020",
              },
              accent: {
                DEFAULT: "#7091E6",
                50: "#EDE8F5",
                100: "#ADBBDA",
                200: "#8697C4",
                300: "#7091E6",
                400: "#5A7BD9",
                500: "#4365CC",
                600: "#364FA6",
                700: "#293980",
                800: "#1C235A",
                900: "#0F1234",
              },
              surface: {
                light: "#FFFFFF",
                dark: "#2A2E45",
              },
              background: {
                light: "#EDE8F5",
                dark: "#1C1F33",
              },
            },
            animation: {
              "fade-in": "fadeIn 0.5s ease-in-out",
              "slide-up": "slideUp 0.5s ease-out",
              "bounce-gentle": "bounceGentle 2s infinite",
            },
            keyframes: {
              fadeIn: {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" },
              },
              slideUp: {
                "0%": { transform: "translateY(20px)", opacity: "0" },
                "100%": { transform: "translateY(0)", opacity: "1" },
              },
              bounceGentle: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-5px)" },
              },
            },
          },
        },
      };
    </script>
    <script
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
      defer
    ></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      [x-cloak] {
        display: none !important;
      }
      body {
        background-color: #EDE8F5;
        min-height: 100vh;
      }
      .card-shadow {
        box-shadow: 0 2px 8px rgba(61, 82, 160, 0.08);
      }
      .card-shadow:hover {
        box-shadow: 0 4px 16px rgba(61, 82, 160, 0.12);
      }
      .stat-card {
        background: #FFFFFF;
        border: 1px solid #E5E7EB;
        transition: all 0.3s ease;
      }
      .stat-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(61, 82, 160, 0.15);
        border-color: #ADBBDA;
      }
      .product-card {
        background: #FFFFFF;
        border: 1px solid #E5E7EB;
        transition: all 0.3s ease;
      }
      .product-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 24px rgba(61, 82, 160, 0.15);
        border-color: #ADBBDA;
      }
      .category-card {
        background: #FFFFFF;
        border: 1px solid #E5E7EB;
        transition: all 0.3s ease;
      }
      .category-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(61, 82, 160, 0.15);
        border-color: #ADBBDA;
      }
    </style>
  </head>
  <body
    th:fragment="layout(page, contentFragment)"
    class="text-gray-800 min-h-screen"
  >
    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-200 shadow-sm">
      <div class="max-w-8xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
          <div class="flex items-center space-x-3">
            <h1
              class="text-2xl font-bold bg-gradient-to-r from-primary-500 to-accent-400 bg-clip-text text-transparent tracking-wide"
            >
              CampusCart
            </h1>
          </div>
          <div class="hidden md:flex items-center space-x-4">
            <div
              class="px-4 py-2 bg-gradient-to-r from-primary-500 to-accent-400 rounded-full hover:from-primary-600 hover:to-accent-500 transition-all"
            >
              <a href="/" class="text-sm text-white font-medium">
                Go To Home
              </a>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <div class="flex h-screen">
      <!-- Sidebar -->
      <div
        class="hidden md:flex md:w-64 md:flex-col bg-white border-r border-gray-200 m-4 rounded-2xl card-shadow"
      >
        <div class="flex flex-col flex-grow pt-5 pb-4 overflow-y-auto">
          <nav class="mt-5 flex-1 px-4 space-y-2">
            <a
              th:href="@{/admin/dashboard}"
              th:classappend="${activeTab == 'dashboard'} ? 'bg-gradient-to-r from-primary-500 to-accent-400 text-white shadow-md' : 'text-gray-700 hover:bg-primary-50 hover:text-primary-600 border border-transparent hover:border-primary-200'"
              class="group flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all duration-300 ease-in-out"
            >
              <i class="fas fa-chart-line mr-3 h-5 w-5"></i>
              Dashboard
            </a>

            <a
              th:href="@{/admin/products}"
              th:classappend="${activeTab == 'products'} ? 'bg-gradient-to-r from-primary-500 to-accent-400 text-white shadow-md' : 'text-gray-700 hover:bg-primary-50 hover:text-primary-600 border border-transparent hover:border-primary-200'"
              class="group flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all duration-300 ease-in-out"
            >
              <i class="fas fa-box mr-3 h-5 w-5"></i>
              Product Management
            </a>

            <a
              th:href="@{/admin/categories}"
              th:classappend="${activeTab == 'categories'} ? 'bg-gradient-to-r from-primary-500 to-accent-400 text-white shadow-md' : 'text-gray-700 hover:bg-primary-50 hover:text-primary-600 border border-transparent hover:border-primary-200'"
              class="group flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all duration-300 ease-in-out"
            >
              <i class="fas fa-tags mr-3 h-5 w-5"></i>
              Categories
            </a>
          </nav>
        </div>
      </div>

      <!-- Main Content -->
      <div class="flex flex-col flex-1 overflow-hidden">
        <main
          class="flex-1 relative z-0 overflow-y-auto focus:outline-none p-4"
        >
          <div class="max-w-7xl mx-auto">
            <div th:insert="${contentFragment}">
              <!-- Page content will be inserted here -->
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Mobile menu toggle -->
    <div class="md:hidden fixed bottom-6 right-6 z-50">
      <button
        x-data="{ open: false }"
        @click="open = !open"
        class="bg-gradient-to-r from-primary-500 to-accent-400 text-white p-4 rounded-full shadow-lg hover:shadow-xl focus:outline-none focus:ring-2 focus:ring-primary-400 transition-all duration-300"
      >
        <i class="fas fa-bars h-5 w-5"></i>
      </button>
    </div>
  </body>
</html>
