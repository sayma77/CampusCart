<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle} + ' - CampusCart Admin'">
      CampusCart Admin
    </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "dark-blue": {
                50: "#f0f9ff",
                100: "#e0f2fe",
                200: "#bae6fd",
                300: "#7dd3fc",
                400: "#38bdf8",
                500: "#0ea5e9",
                600: "#0284c7",
                700: "#0369a1",
                800: "#075985",
                900: "#0c4a6e",
                950: "#082f49",
              },
              midnight: {
                50: "#f8fafc",
                100: "#f1f5f9",
                200: "#e2e8f0",
                300: "#cbd5e1",
                400: "#94a3b8",
                500: "#64748b",
                600: "#475569",
                700: "#334155",
                800: "#1e293b",
                900: "#0f172a",
                950: "#020617",
              },
            },
          },
        },
      };
    </script>
    <script
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
      defer
    ></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      [x-cloak] {
        display: none !important;
      }
      body {
        background: linear-gradient(
          135deg,
          #0f172a 0%,
          #1e293b 50%,
          #0c4a6e 100%
        );
        min-height: 100vh;
      }
      .glass-effect {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(56, 189, 248, 0.2);
      }
      .glow-effect {
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
      }
      .stat-card {
        background: linear-gradient(
          135deg,
          rgba(30, 41, 59, 0.8) 0%,
          rgba(15, 23, 42, 0.9) 100%
        );
        backdrop-filter: blur(15px);
        border: 1px solid rgba(56, 189, 248, 0.3);
        transition: all 0.3s ease;
      }
      .stat-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4);
        border-color: rgba(56, 189, 248, 0.5);
      }
      .product-card {
        background: linear-gradient(
          135deg,
          rgba(30, 41, 59, 0.8) 0%,
          rgba(15, 23, 42, 0.9) 100%
        );
        backdrop-filter: blur(15px);
        border: 1px solid rgba(56, 189, 248, 0.3);
        transition: all 0.3s ease;
      }
      .product-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 30px rgba(56, 189, 248, 0.4);
        border-color: rgba(56, 189, 248, 0.5);
      }
      .category-card {
        background: linear-gradient(
          135deg,
          rgba(30, 41, 59, 0.8) 0%,
          rgba(15, 23, 42, 0.9) 100%
        );
        backdrop-filter: blur(15px);
        border: 1px solid rgba(56, 189, 248, 0.3);
        transition: all 0.3s ease;
      }
      .category-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4);
        border-color: rgba(56, 189, 248, 0.5);
      }
    </style>
  </head>
  <body
    th:fragment="layout(page, contentFragment)"
    class="text-slate-100 min-h-screen"
  >
    <!-- Navbar -->
    <nav class="glass-effect border-b border-cyan-500/30 shadow-lg">
      <div class="max-w-8xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
          <div class="flex items-center space-x-3">
            <h1
              class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-400 bg-clip-text text-transparent tracking-wide"
            >
              CampusCart
            </h1>
          </div>
          <div class="hidden md:flex items-center space-x-4">
            <div
              class="px-4 py-2 bg-gradient-to-r from-dark-blue-800 to-dark-blue-700 rounded-full border border-cyan-500/30"
            >
              <a href="/" class="text-sm text-cyan-300 font-medium">
                Go To Home
              </a>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <div class="flex h-screen">
      <!-- Sidebar -->
      <div
        class="hidden md:flex md:w-64 md:flex-col glass-effect border-r border-cyan-500/30 m-4 rounded-2xl"
      >
        <div class="flex flex-col flex-grow pt-5 pb-4 overflow-y-auto">
          <nav class="mt-5 flex-1 px-4 space-y-2">
            <a
              th:href="@{/admin/dashboard}"
              th:classappend="${activeTab == 'dashboard'} ? 'bg-gradient-to-r from-cyan-500 to-blue-500 text-white shadow-lg glow-effect' : 'text-slate-300 hover:bg-dark-blue-800/50 hover:text-cyan-400 border border-transparent hover:border-cyan-500/30'"
              class="group flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all duration-300 ease-in-out"
            >
              <i class="fas fa-chart-line mr-3 h-5 w-5"></i>
              Dashboard
            </a>

            <a
              th:href="@{/admin/products}"
              th:classappend="${activeTab == 'products'} ? 'bg-gradient-to-r from-cyan-500 to-blue-500 text-white shadow-lg glow-effect' : 'text-slate-300 hover:bg-dark-blue-800/50 hover:text-cyan-400 border border-transparent hover:border-cyan-500/30'"
              class="group flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all duration-300 ease-in-out"
            >
              <i class="fas fa-box mr-3 h-5 w-5"></i>
              Product Management
            </a>

            <a
              th:href="@{/admin/categories}"
              th:classappend="${activeTab == 'categories'} ? 'bg-gradient-to-r from-cyan-500 to-blue-500 text-white shadow-lg glow-effect' : 'text-slate-300 hover:bg-dark-blue-800/50 hover:text-cyan-400 border border-transparent hover:border-cyan-500/30'"
              class="group flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all duration-300 ease-in-out"
            >
              <i class="fas fa-tags mr-3 h-5 w-5"></i>
              Categories
            </a>
          </nav>
        </div>
      </div>

      <!-- Main Content -->
      <div class="flex flex-col flex-1 overflow-hidden">
        <main
          class="flex-1 relative z-0 overflow-y-auto focus:outline-none p-4"
        >
          <div class="max-w-7xl mx-auto">
            <div th:insert="${contentFragment}">
              <!-- Page content will be inserted here -->
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Mobile menu toggle -->
    <div class="md:hidden fixed bottom-6 right-6 z-50">
      <button
        x-data="{ open: false }"
        @click="open = !open"
        class="bg-gradient-to-r from-cyan-500 to-blue-500 text-white p-4 rounded-full shadow-lg hover:shadow-xl glow-effect focus:outline-none focus:ring-2 focus:ring-cyan-400 transition-all duration-300"
      >
        <i class="fas fa-bars h-5 w-5"></i>
      </button>
    </div>
  </body>
</html>
