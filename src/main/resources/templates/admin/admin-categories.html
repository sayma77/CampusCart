<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Category Management - CampusCart Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "dark-blue": {
                50: "#f0f9ff",
                100: "#e0f2fe",
                200: "#bae6fd",
                300: "#7dd3fc",
                400: "#38bdf8",
                500: "#0ea5e9",
                600: "#0284c7",
                700: "#0369a1",
                800: "#075985",
                900: "#0c4a6e",
                950: "#082f49",
              },
              midnight: {
                50: "#f8fafc",
                100: "#f1f5f9",
                200: "#e2e8f0",
                300: "#cbd5e1",
                400: "#94a3b8",
                500: "#64748b",
                600: "#475569",
                700: "#334155",
                800: "#1e293b",
                900: "#0f172a",
                950: "#020617",
              },
            },
          },
        },
      };
    </script>
    <script
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
      defer
    ></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      [x-cloak] {
        display: none !important;
      }
      body {
        background: linear-gradient(
          135deg,
          #0f172a 0%,
          #1e293b 50%,
          #0c4a6e 100%
        );
        min-height: 100vh;
      }
      .glass-effect {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(56, 189, 248, 0.2);
      }
      .category-card {
        background: linear-gradient(
          135deg,
          rgba(30, 41, 59, 0.8) 0%,
          rgba(15, 23, 42, 0.9) 100%
        );
        backdrop-filter: blur(15px);
        border: 1px solid rgba(56, 189, 248, 0.3);
        transition: all 0.3s ease;
      }
      .category-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4);
        border-color: rgba(56, 189, 248, 0.5);
      }
    </style>
  </head>
  <body class="text-slate-100 min-h-screen">
    <div th:insert="admin/admin-layout :: layout('categories', ~{::content})">
      <div th:fragment="content" x-data="categoryManagement()">
        <!-- Page Header -->
        <div class="md:flex md:items-center md:justify-between mb-8">
          <div class="flex-1 min-w-0">
            <h2
              class="text-3xl font-bold bg-gradient-to-r from-cyan-400 to-blue-400 bg-clip-text text-transparent"
            >
              Category Management
            </h2>
            <p class="mt-2 text-slate-400 text-lg">
              Organize products into categories for better discovery
            </p>
          </div>
        </div>

        <!-- Categories Grid -->
        <div
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"
        >
          <div
            th:each="category : ${categories}"
            class="category-card rounded-2xl shadow-xl overflow-hidden"
          >
            <div class="p-8">
              <!-- Category Icon -->
              <div class="flex items-center justify-between mb-6">
                <div
                  class="w-16 h-16 bg-gradient-to-br from-cyan-400 to-blue-500 rounded-2xl flex items-center justify-center shadow-lg"
                >
                  <i class="fas fa-tags text-white text-2xl"></i>
                </div>
                <div class="flex space-x-2">
                  <button
                    @click="editCategory(category)"
                    th:attr="data-category-id=${category.id}"
                    class="w-10 h-10 bg-dark-blue-700/50 hover:bg-cyan-600/20 border border-slate-600 hover:border-cyan-500/50 rounded-lg flex items-center justify-center text-slate-400 hover:text-cyan-400 transition-all"
                  >
                    <i class="fas fa-edit text-sm"></i>
                  </button>
                  <button
                    @click="deleteCategory(category.id)"
                    class="w-10 h-10 bg-dark-blue-700/50 hover:bg-red-600/20 border border-slate-600 hover:border-red-500/50 rounded-lg flex items-center justify-center text-slate-400 hover:text-red-400 transition-all"
                  >
                    <i class="fas fa-trash text-sm"></i>
                  </button>
                </div>
              </div>

              <!-- Category Info -->
              <div class="space-y-3">
                <h3
                  th:text="${category.name}"
                  class="text-xl font-bold text-white leading-tight"
                >
                  Electronics & Gadgets
                </h3>
                <p
                  th:text="${category.description}"
                  class="text-slate-400 text-sm leading-relaxed"
                >
                  Latest tech gadgets, smartphones, laptops, and electronic
                  devices for students
                </p>
                <div class="pt-4 border-t border-slate-700/50">
                  <div class="flex items-center justify-between text-sm">
                    <span class="text-slate-400">Products</span>
                    <span class="font-semibold text-cyan-400">24 items</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Add New Category Card -->
          <div
            @click="showCategoryModal = true; editingCategory = null"
            class="category-card rounded-2xl shadow-xl overflow-hidden cursor-pointer group border-dashed border-2 border-cyan-500/30 hover:border-cyan-400/50"
          >
            <div
              class="p-8 h-full flex flex-col items-center justify-center text-center space-y-4"
            >
              <div
                class="w-16 h-16 bg-gradient-to-br from-cyan-400/20 to-blue-500/20 rounded-2xl flex items-center justify-center group-hover:from-cyan-400/30 group-hover:to-blue-500/30 transition-all"
              >
                <i class="fas fa-plus text-cyan-400 text-2xl"></i>
              </div>
              <div>
                <h3 class="text-lg font-semibold text-cyan-400 mb-2">
                  Add Category
                </h3>
                <p class="text-slate-500 text-sm">
                  Create a new product category
                </p>
              </div>
            </div>
          </div>
        </div>

        <!-- Category Modal -->
        <div
          x-show="showCategoryModal"
          x-cloak
          class="fixed inset-0 bg-black/70 backdrop-blur-sm overflow-y-auto h-full w-full z-50 flex items-center justify-center p-4"
          @click.self="showCategoryModal = false"
        >
          <div
            class="relative w-full max-w-lg glass-effect rounded-2xl shadow-2xl border border-cyan-500/30"
            @click.stop
          >
            <div class="p-8">
              <!-- Modal Header -->
              <div class="flex items-center justify-between mb-6">
                <h3
                  class="text-2xl font-bold text-white"
                  x-text="editingCategory ? 'Edit Category' : 'Create New Category'"
                >
                  Create New Category
                </h3>
                <button
                  @click="showCategoryModal = false"
                  class="w-10 h-10 bg-dark-blue-700/50 hover:bg-red-600/20 border border-slate-600 hover:border-red-500/50 rounded-lg flex items-center justify-center text-slate-400 hover:text-red-400 transition-all"
                >
                  <i class="fas fa-times"></i>
                </button>
              </div>

              <!-- Form -->
              <form @submit.prevent="saveCategory()" class="space-y-6">
                <div>
                  <label
                    class="block text-sm font-semibold text-cyan-300 mb-3 uppercase tracking-wide"
                  >
                    Category Name
                  </label>
                  <input
                    type="text"
                    x-model="categoryForm.name"
                    required
                    placeholder="Enter category name..."
                    class="w-full py-3 px-4 rounded-xl bg-dark-blue-900/50 border border-cyan-500/30 text-slate-100 placeholder-slate-400 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 focus:outline-none transition-all"
                  />
                </div>

                <div>
                  <label
                    class="block text-sm font-semibold text-cyan-300 mb-3 uppercase tracking-wide"
                  >
                    Description
                  </label>
                  <textarea
                    x-model="categoryForm.description"
                    rows="4"
                    placeholder="Describe this category..."
                    class="w-full py-3 px-4 rounded-xl bg-dark-blue-900/50 border border-cyan-500/30 text-slate-100 placeholder-slate-400 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 focus:outline-none transition-all resize-none"
                  ></textarea>
                </div>

                <!-- Action Buttons -->
                <div
                  class="flex justify-end space-x-4 pt-6 border-t border-slate-700/50"
                >
                  <button
                    type="button"
                    @click="showCategoryModal = false"
                    class="px-6 py-3 bg-dark-blue-700/50 hover:bg-dark-blue-600/50 border border-slate-600 hover:border-slate-500 rounded-xl text-slate-300 font-semibold transition-all"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    class="px-6 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold rounded-xl shadow-lg hover:shadow-xl transition-all"
                  >
                    <span
                      x-text="editingCategory ? 'Update Category' : 'Create Category'"
                      >Create Category</span
                    >
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function categoryManagement() {
        return {
          showCategoryModal: false,
          editingCategory: null,
          categoryForm: {
            name: "",
            description: "",
            icon: "fas fa-tags",
            colorClass: "from-cyan-400 to-blue-500",
            active: true,
          },

          editCategory(category) {
            this.editingCategory = category;
            this.categoryForm = { ...category };
            this.showCategoryModal = true;
          },

          saveCategory() {
            console.log("Saving category:", this.categoryForm);
            // Show success message or handle response
            this.showCategoryModal = false;
            this.resetForm();
          },

          deleteCategory(categoryId) {
            if (
              confirm(
                "Are you sure you want to delete this category? This will affect all products in this category."
              )
            ) {
              console.log("Deleting category:", categoryId);
            }
          },

          resetForm() {
            this.categoryForm = {
              name: "",
              description: "",
              icon: "fas fa-tags",
              colorClass: "from-cyan-400 to-blue-500",
              active: true,
            };
            this.editingCategory = null;
          },
        };
      }
    </script>
  </body>
</html>
