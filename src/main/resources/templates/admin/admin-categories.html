<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Category Management - CampusCart Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: "#3D52A0",
                50: "#EDE8F5",
                100: "#ADBBDA",
                200: "#8697C4",
                300: "#7091E6",
                400: "#3D52A0",
                500: "#3D52A0",
                600: "#2F4080",
                700: "#233060",
                800: "#172040",
                900: "#0B1020",
              },
              accent: {
                DEFAULT: "#7091E6",
                50: "#EDE8F5",
                100: "#ADBBDA",
                200: "#8697C4",
                300: "#7091E6",
                400: "#5A7BD9",
                500: "#4365CC",
                600: "#364FA6",
                700: "#293980",
                800: "#1C235A",
                900: "#0F1234",
              },
              surface: {
                light: "#FFFFFF",
                dark: "#2A2E45",
              },
              background: {
                light: "#EDE8F5",
                dark: "#1C1F33",
              },
            },
            animation: {
              "fade-in": "fadeIn 0.5s ease-in-out",
              "slide-up": "slideUp 0.5s ease-out",
              "bounce-gentle": "bounceGentle 2s infinite",
            },
            keyframes: {
              fadeIn: {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" },
              },
              slideUp: {
                "0%": { transform: "translateY(20px)", opacity: "0" },
                "100%": { transform: "translateY(0)", opacity: "1" },
              },
              bounceGentle: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-5px)" },
              },
            },
          },
        },
      };
    </script>
    <script
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
      defer
    ></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      [x-cloak] {
        display: none !important;
      }
      body {
        background-color: #EDE8F5;
        min-height: 100vh;
      }
      .category-card {
        background: #FFFFFF;
        border: 1px solid #E5E7EB;
        transition: all 0.3s ease;
      }
      .category-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(61, 82, 160, 0.15);
        border-color: #ADBBDA;
      }
    </style>
  </head>
  <body class="text-gray-800 min-h-screen">
    <div th:insert="admin/admin-layout :: layout('categories', ~{::content})">
      <div th:fragment="content" x-data="categoryManagement()">
        <!-- Page Header -->
        <div class="md:flex md:items-center md:justify-between mb-8">
          <div class="flex-1 min-w-0">
            <h2
              class="text-3xl font-bold bg-gradient-to-r from-primary-500 to-accent-400 bg-clip-text text-transparent"
            >
              Category Management
            </h2>
            <p class="mt-2 text-gray-600 text-lg">
              Organize products into categories for better discovery
            </p>
          </div>
        </div>

        <!-- Categories Grid -->
        <div
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"
        >
          <div
            th:each="category : ${categories}"
            class="category-card rounded-2xl shadow-md overflow-hidden"
          >
            <div class="p-8">
              <!-- Category Icon -->
              <div class="flex items-center justify-between mb-6">
                <div
                  class="w-16 h-16 bg-gradient-to-br from-primary-500 to-accent-400 rounded-2xl flex items-center justify-center shadow-md"
                >
                  <i class="fas fa-tags text-white text-2xl"></i>
                </div>
                <div class="flex space-x-2">
                  <form
                    th:action="@{/admin/categories/remove}"
                    method="post"
                    th:object="${category}"
                  >
                    <input
                      type="hidden"
                      name="categoryId"
                      th:value="${category.id}"
                    />
                    <button
                      type="submit"
                      class="w-10 h-10 bg-gray-100 hover:bg-red-50 border border-gray-300 hover:border-red-300 rounded-lg flex items-center justify-center text-gray-500 hover:text-red-500 transition-all"
                    >
                      <i class="fas fa-trash text-sm"></i>
                    </button>
                  </form>
                </div>
              </div>

              <!-- Category Info -->
              <div class="space-y-3">
                <h3
                  th:text="${category.name}"
                  class="text-xl font-bold text-gray-800 leading-tight"
                >
                  Electronics & Gadgets
                </h3>
                <p
                  th:text="${category.description}"
                  class="text-gray-600 text-sm leading-relaxed"
                >
                  Latest tech gadgets, smartphones, laptops, and electronic
                  devices for students
                </p>
              </div>
            </div>
          </div>

          <!-- Add New Category Card -->
          <div
            @click="showCategoryModal = true; editingCategory = null"
            class="category-card rounded-2xl shadow-md overflow-hidden cursor-pointer group border-dashed border-2 border-primary-200 hover:border-primary-400"
          >
            <div
              class="p-8 h-full flex flex-col items-center justify-center text-center space-y-4"
            >
              <div
                class="w-16 h-16 bg-gradient-to-br from-primary-100 to-accent-100 rounded-2xl flex items-center justify-center group-hover:from-primary-200 group-hover:to-accent-200 transition-all"
              >
                <i class="fas fa-plus text-primary-500 text-2xl"></i>
              </div>
              <div>
                <h3 class="text-lg font-semibold text-primary-600 mb-2">
                  Add Category
                </h3>
                <p class="text-gray-500 text-sm">
                  Create a new product category
                </p>
              </div>
            </div>
          </div>
        </div>

        <!-- Category Modal -->
        <div
          x-show="showCategoryModal"
          x-cloak
          class="fixed inset-0 bg-black/50 backdrop-blur-sm overflow-y-auto h-full w-full z-50 flex items-center justify-center p-4"
          @click.self="showCategoryModal = false"
        >
          <div
            class="relative w-full max-w-lg bg-white rounded-2xl shadow-2xl border border-gray-200"
            @click.stop
          >
            <div class="p-8">
              <!-- Modal Header -->
              <div class="flex items-center justify-between mb-6">
                <h3
                  class="text-2xl font-bold text-gray-800"
                  x-text="editingCategory ? 'Edit Category' : 'Create New Category'"
                >
                  Create New Category
                </h3>
                <button
                  @click="showCategoryModal = false"
                  class="w-10 h-10 bg-gray-100 hover:bg-red-50 border border-gray-300 hover:border-red-300 rounded-lg flex items-center justify-center text-gray-500 hover:text-red-500 transition-all"
                >
                  <i class="fas fa-times"></i>
                </button>
              </div>

              <!-- Form -->
              <form
                th:action="@{/admin/categories/add}"
                method="post"
                class="space-y-6"
              >
                <div>
                  <label
                    class="block text-sm font-semibold text-primary-600 mb-3 uppercase tracking-wide"
                  >
                    Category Name
                  </label>
                  <input
                    type="text"
                    name="name"
                    required
                    placeholder="Enter category name..."
                    class="w-full py-3 px-4 rounded-xl bg-gray-50 border border-gray-300 text-gray-800 placeholder-gray-400 focus:border-primary-400 focus:ring-2 focus:ring-primary-200 focus:outline-none transition-all"
                  />
                </div>

                <div>
                  <label
                    class="block text-sm font-semibold text-primary-600 mb-3 uppercase tracking-wide"
                  >
                    Description
                  </label>
                  <textarea
                    name="description"
                    rows="4"
                    placeholder="Describe this category..."
                    class="w-full py-3 px-4 rounded-xl bg-gray-50 border border-gray-300 text-gray-800 placeholder-gray-400 focus:border-primary-400 focus:ring-2 focus:ring-primary-200 focus:outline-none transition-all resize-none"
                  ></textarea>
                </div>

                <div
                  class="flex justify-end space-x-4 pt-6 border-t border-gray-200"
                >
                  <button
                    type="button"
                    @click="showCategoryModal = false"
                    class="px-6 py-3 bg-gray-100 hover:bg-gray-200 border border-gray-300 hover:border-gray-400 rounded-xl text-gray-700 font-semibold transition-all"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    class="px-6 py-3 bg-gradient-to-r from-primary-500 to-accent-400 hover:from-primary-600 hover:to-accent-500 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all"
                  >
                    Create Category
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function categoryManagement() {
        return {
          showCategoryModal: false,
          editingCategory: null,
          categoryForm: {
            name: "",
            description: "",
            icon: "fas fa-tags",
            colorClass: "from-primary-500 to-accent-400",
            active: true,
          },

          editCategory(category) {
            this.editingCategory = category;
            this.categoryForm = { ...category };
            this.showCategoryModal = true;
          },

          saveCategory() {
            console.log("Saving category:", this.categoryForm);
            this.showCategoryModal = false;
            this.resetForm();
          },

          deleteCategory(categoryId) {
            if (
              confirm(
                "Are you sure you want to delete this category? This will affect all products in this category."
              )
            ) {
              console.log("Deleting category:", categoryId);
            }
          },

          resetForm() {
            this.categoryForm = {
              name: "",
              description: "",
              icon: "fas fa-tags",
              colorClass: "from-primary-500 to-accent-400",
              active: true,
            };
            this.editingCategory = null;
          },
        };
      }
    </script>
  </body>
</html>
