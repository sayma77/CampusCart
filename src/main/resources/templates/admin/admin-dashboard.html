<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - CampusCart Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "dark-blue": {
                50: "#f0f9ff",
                100: "#e0f2fe",
                200: "#bae6fd",
                300: "#7dd3fc",
                400: "#38bdf8",
                500: "#0ea5e9",
                600: "#0284c7",
                700: "#0369a1",
                800: "#075985",
                900: "#0c4a6e",
                950: "#082f49",
              },
              midnight: {
                50: "#f8fafc",
                100: "#f1f5f9",
                200: "#e2e8f0",
                300: "#cbd5e1",
                400: "#94a3b8",
                500: "#64748b",
                600: "#475569",
                700: "#334155",
                800: "#1e293b",
                900: "#0f172a",
                950: "#020617",
              },
            },
          },
        },
      };
    </script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(
          135deg,
          #0f172a 0%,
          #1e293b 50%,
          #0c4a6e 100%
        );
        min-height: 100vh;
      }
      .glass-effect {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(56, 189, 248, 0.2);
      }
      .featured-card {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(56, 189, 248, 0.2);
        transition: all 0.3s ease;
      }
      .featured-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 20px 40px rgba(56, 189, 248, 0.3);
      }
      .action-button {
        background: linear-gradient(
          135deg,
          rgba(30, 41, 59, 0.8) 0%,
          rgba(15, 23, 42, 0.9) 100%
        );
        backdrop-filter: blur(15px);
        border: 1px solid rgba(71, 85, 105, 0.5);
        transition: all 0.3s ease;
      }
      .action-button:hover {
        transform: translateY(-4px);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
      }
      .action-button.review:hover {
        border-color: rgba(251, 191, 36, 0.6);
        box-shadow: 0 15px 30px rgba(251, 191, 36, 0.2);
      }
      .action-button.categories:hover {
        border-color: rgba(52, 211, 153, 0.6);
        box-shadow: 0 15px 30px rgba(52, 211, 153, 0.2);
      }
      .bg-decoration {
        position: absolute;
        opacity: 0.05;
      }
      .bg-decoration.top-left {
        top: 2.5rem;
        left: 2.5rem;
        width: 8rem;
        height: 8rem;
        background: #38bdf8;
        border-radius: 50%;
        filter: blur(3rem);
      }
      .bg-decoration.bottom-right {
        bottom: 2.5rem;
        right: 2.5rem;
        width: 6rem;
        height: 6rem;
        background: #3b82f6;
        border-radius: 50%;
        filter: blur(2rem);
      }
    </style>
  </head>
  <body class="text-slate-100 min-h-screen">
    <div th:replace="admin/admin-layout :: layout('dashboard', ~{::content})">
      <div th:fragment="content">
        <div class="container mx-auto px-6 py-8">
          <!-- Page Header -->
          <div class="text-center mb-16">
            <h1
              class="text-4xl md:text-3xl font-bold bg-gradient-to-r from-cyan-400 to-blue-400 bg-clip-text text-transparent mb-4"
            >
              CampusCart Admin
            </h1>
            <p class="text-slate-400 text-lg max-w-2xl mx-auto">
              Streamlined dashboard for efficient platform management
            </p>
          </div>

          <!-- Main Content Container -->
          <div class="max-w-3xl mx-auto">
            <!-- Total Users - Featured Section -->
            <div class="mb-8">
              <div
                class="featured-card rounded-2xl shadow-2xl p-6 text-center relative overflow-hidden"
              >
                <!-- Background decoration -->
                <div class="bg-decoration top-left"></div>
                <div class="bg-decoration bottom-right"></div>

                <div class="relative z-10">
                  <div
                    class="w-16 h-10 bg-gradient-to-br from-cyan-400 to-cyan-600 rounded-xl mx-auto mb-4 flex items-center justify-center shadow-lg"
                  >
                    <i class="fas fa-users text-white text-2xl"></i>
                  </div>

                  <h2
                    class="text-xl font-semibold text-slate-300 mb-2 uppercase tracking-wide"
                  >
                    Total Platform Users
                  </h2>

                  <div
                    class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-400 bg-clip-text text-transparent mb-2"
                    th:text="${totalUsers}"
                  ></div>

                  <p class="text-slate-400 text-sm">
                    Active members in the CampusCart community
                  </p>
                </div>
              </div>
            </div>

            <!-- Quick Actions -->
            <div class="glass-effect rounded-2xl shadow-2xl p-4">
              <h3 class="text-xl font-bold text-white mb-6 text-center">
                Management Actions
              </h3>

              <div class="grid md:grid-cols-2 gap-4">
                <!-- Review Products -->
                <button
                  onclick="window.location.href='/admin/products?status=pending'"
                  class="action-button review group relative p-4 rounded-xl text-center"
                >
                  <div
                    class="absolute inset-0 rounded-xl bg-gradient-to-br from-amber-400/5 to-orange-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-300"
                  ></div>

                  <div class="relative z-10">
                    <div
                      class="w-12 h-12 bg-gradient-to-br from-amber-400 to-orange-500 rounded-xl mx-auto mb-3 flex items-center justify-center group-hover:scale-110 transition-transform duration-300 shadow-lg"
                    >
                      <i class="fas fa-clock text-white text-2xl"></i>
                    </div>

                    <h4
                      class="text-lg font-semibold text-white group-hover:text-amber-300 transition-colors mb-1"
                    >
                      Review Products
                    </h4>

                    <p
                      class="text-slate-400 text-xs group-hover:text-slate-300 transition-colors"
                    >
                      Approve or reject pending product listings from students
                    </p>
                  </div>
                </button>

                <!-- Manage Categories -->
                <button
                  onclick="window.location.href='/admin/categories'"
                  class="action-button categories group relative p-4 rounded-xl text-center"
                >
                  <div
                    class="absolute inset-0 rounded-xl bg-gradient-to-br from-emerald-400/5 to-green-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-300"
                  ></div>

                  <div class="relative z-10">
                    <div
                      class="w-12 h-12 bg-gradient-to-br from-emerald-400 to-green-500 rounded-xl mx-auto mb-3 flex items-center justify-center group-hover:scale-110 transition-transform duration-300 shadow-lg"
                    >
                      <i class="fas fa-tags text-white text-2xl"></i>
                    </div>

                    <h4
                      class="text-lg font-semibold text-white group-hover:text-emerald-300 transition-colors mb-1"
                    >
                      Manage Categories
                    </h4>

                    <p
                      class="text-slate-400 text-xs group-hover:text-slate-300 transition-colors"
                    >
                      Organize and create product categories for better browsing
                    </p>
                  </div>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
