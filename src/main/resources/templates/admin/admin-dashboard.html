<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - CampusCart Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: "#3D52A0",
                50: "#EDE8F5",
                100: "#ADBBDA",
                200: "#8697C4",
                300: "#7091E6",
                400: "#3D52A0",
                500: "#3D52A0",
                600: "#2F4080",
                700: "#233060",
                800: "#172040",
                900: "#0B1020",
              },
              accent: {
                DEFAULT: "#7091E6",
                50: "#EDE8F5",
                100: "#ADBBDA",
                200: "#8697C4",
                300: "#7091E6",
                400: "#5A7BD9",
                500: "#4365CC",
                600: "#364FA6",
                700: "#293980",
                800: "#1C235A",
                900: "#0F1234",
              },
              surface: {
                light: "#FFFFFF",
                dark: "#2A2E45",
              },
              background: {
                light: "#EDE8F5",
                dark: "#1C1F33",
              },
            },
            animation: {
              "fade-in": "fadeIn 0.5s ease-in-out",
              "slide-up": "slideUp 0.5s ease-out",
              "bounce-gentle": "bounceGentle 2s infinite",
            },
            keyframes: {
              fadeIn: {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" },
              },
              slideUp: {
                "0%": { transform: "translateY(20px)", opacity: "0" },
                "100%": { transform: "translateY(0)", opacity: "1" },
              },
              bounceGentle: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-5px)" },
              },
            },
          },
        },
      };
    </script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #EDE8F5;
        min-height: 100vh;
      }
      .featured-card {
        background: #FFFFFF;
        border: 1px solid #E5E7EB;
        transition: all 0.3s ease;
      }
      .featured-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(61, 82, 160, 0.15);
      }
      .action-button {
        background: #FFFFFF;
        border: 1px solid #E5E7EB;
        transition: all 0.3s ease;
      }
      .action-button:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 20px rgba(61, 82, 160, 0.12);
      }
      .action-button.review:hover {
        border-color: #FCD34D;
        box-shadow: 0 8px 20px rgba(251, 191, 36, 0.2);
      }
      .action-button.categories:hover {
        border-color: #6EE7B7;
        box-shadow: 0 8px 20px rgba(52, 211, 153, 0.2);
      }
      .bg-decoration {
        position: absolute;
        opacity: 0.03;
      }
      .bg-decoration.top-left {
        top: 2.5rem;
        left: 2.5rem;
        width: 8rem;
        height: 8rem;
        background: #7091E6;
        border-radius: 50%;
        filter: blur(3rem);
      }
      .bg-decoration.bottom-right {
        bottom: 2.5rem;
        right: 2.5rem;
        width: 6rem;
        height: 6rem;
        background: #3D52A0;
        border-radius: 50%;
        filter: blur(2rem);
      }
    </style>
  </head>
  <body class="text-gray-800 min-h-screen">
    <div th:replace="admin/admin-layout :: layout('dashboard', ~{::content})">
      <div th:fragment="content">
        <div class="container mx-auto px-6 py-8">
          <!-- Page Header -->
          <div class="text-center mb-16">
            <h1
              class="text-4xl md:text-3xl font-bold bg-gradient-to-r from-primary-500 to-accent-400 bg-clip-text text-transparent mb-4"
            >
              CampusCart Admin
            </h1>
            <p class="text-gray-600 text-lg max-w-2xl mx-auto">
              Streamlined dashboard for efficient platform management
            </p>
          </div>

          <!-- Main Content Container -->
          <div class="max-w-3xl mx-auto">
            <!-- Total Users - Featured Section -->
            <div class="mb-8">
              <div
                class="featured-card rounded-2xl shadow-lg p-6 text-center relative overflow-hidden"
              >
                <!-- Background decoration -->
                <div class="bg-decoration top-left"></div>
                <div class="bg-decoration bottom-right"></div>

                <div class="relative z-10">
                  <div
                    class="w-16 h-10 bg-gradient-to-br from-primary-500 to-accent-400 rounded-xl mx-auto mb-4 flex items-center justify-center shadow-md"
                  >
                    <i class="fas fa-users text-white text-2xl"></i>
                  </div>

                  <h2
                    class="text-xl font-semibold text-gray-700 mb-2 uppercase tracking-wide"
                  >
                    Total Platform Users
                  </h2>

                  <div
                    class="text-2xl font-bold bg-gradient-to-r from-primary-500 to-accent-400 bg-clip-text text-transparent mb-2"
                    th:text="${totalUsers}"
                  ></div>

                  <p class="text-gray-500 text-sm">
                    Active members in the CampusCart community
                  </p>
                </div>
              </div>
            </div>

            <!-- Quick Actions -->
            <div class="bg-white rounded-2xl shadow-lg p-4 border border-gray-200">
              <h3 class="text-xl font-bold text-gray-800 mb-6 text-center">
                Management Actions
              </h3>

              <div class="grid md:grid-cols-2 gap-4">
                <!-- Review Products -->
                <button
                  onclick="window.location.href='/admin/products?status=pending'"
                  class="action-button review group relative p-4 rounded-xl text-center"
                >
                  <div
                    class="absolute inset-0 rounded-xl bg-gradient-to-br from-amber-50 to-orange-50 opacity-0 group-hover:opacity-100 transition-opacity duration-300"
                  ></div>

                  <div class="relative z-10">
                    <div
                      class="w-12 h-12 bg-gradient-to-br from-amber-400 to-orange-500 rounded-xl mx-auto mb-3 flex items-center justify-center group-hover:scale-110 transition-transform duration-300 shadow-md"
                    >
                      <i class="fas fa-clock text-white text-2xl"></i>
                    </div>

                    <h4
                      class="text-lg font-semibold text-gray-800 group-hover:text-amber-600 transition-colors mb-1"
                    >
                      Review Products
                    </h4>

                    <p
                      class="text-gray-600 text-xs group-hover:text-gray-700 transition-colors"
                    >
                      Approve or reject pending product listings from students
                    </p>
                  </div>
                </button>

                <!-- Manage Categories -->
                <button
                  onclick="window.location.href='/admin/categories'"
                  class="action-button categories group relative p-4 rounded-xl text-center"
                >
                  <div
                    class="absolute inset-0 rounded-xl bg-gradient-to-br from-emerald-50 to-green-50 opacity-0 group-hover:opacity-100 transition-opacity duration-300"
                  ></div>

                  <div class="relative z-10">
                    <div
                      class="w-12 h-12 bg-gradient-to-br from-emerald-400 to-green-500 rounded-xl mx-auto mb-3 flex items-center justify-center group-hover:scale-110 transition-transform duration-300 shadow-md"
                    >
                      <i class="fas fa-tags text-white text-2xl"></i>
                    </div>

                    <h4
                      class="text-lg font-semibold text-gray-800 group-hover:text-emerald-600 transition-colors mb-1"
                    >
                      Manage Categories
                    </h4>

                    <p
                      class="text-gray-600 text-xs group-hover:text-gray-700 transition-colors"
                    >
                      Organize and create product categories for better browsing
                    </p>
                  </div>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
