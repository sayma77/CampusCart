<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Management - CampusCart Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "dark-blue": {
                50: "#f0f9ff",
                100: "#e0f2fe",
                200: "#bae6fd",
                300: "#7dd3fc",
                400: "#38bdf8",
                500: "#0ea5e9",
                600: "#0284c7",
                700: "#0369a1",
                800: "#075985",
                900: "#0c4a6e",
                950: "#082f49",
              },
              midnight: {
                50: "#f8fafc",
                100: "#f1f5f9",
                200: "#e2e8f0",
                300: "#cbd5e1",
                400: "#94a3b8",
                500: "#64748b",
                600: "#475569",
                700: "#334155",
                800: "#1e293b",
                900: "#0f172a",
                950: "#020617",
              },
            },
          },
        },
      };
    </script>
    <script
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
      defer
    ></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      [x-cloak] {
        display: none !important;
      }
      body {
        background: linear-gradient(
          135deg,
          #0f172a 0%,
          #1e293b 50%,
          #0c4a6e 100%
        );
        min-height: 100vh;
      }
      .glass-effect {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(56, 189, 248, 0.2);
      }
      .product-card {
        background: linear-gradient(
          135deg,
          rgba(30, 41, 59, 0.8) 0%,
          rgba(15, 23, 42, 0.9) 100%
        );
        backdrop-filter: blur(15px);
        border: 1px solid rgba(56, 189, 248, 0.3);
        transition: all 0.3s ease;
      }
      .product-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 30px rgba(56, 189, 248, 0.4);
        border-color: rgba(56, 189, 248, 0.5);
      }
    </style>
  </head>
  <body class="text-slate-100 min-h-screen">
    <div th:insert="admin/admin-layout :: layout('products', ~{::content})">
      <div th:fragment="content" x-data="productManagement()">
        <!-- Page Header -->
        <div class="md:flex md:items-center md:justify-between mb-8">
          <div class="flex-1 min-w-0">
            <h2
              class="text-3xl font-bold bg-gradient-to-r from-cyan-400 to-blue-400 bg-clip-text text-transparent"
            >
              Product Management
            </h2>
            <p class="mt-2 text-slate-400 text-lg">
              Review and manage all products on the platform
            </p>
          </div>
        </div>

        <!-- Filters -->
        <div class="glass-effect rounded-2xl mb-8 border border-cyan-500/30">
          <div class="px-8 py-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
              <!-- Search -->
              <div class="md:col-span-2">
                <label
                  class="block text-sm font-semibold text-cyan-300 mb-3 uppercase tracking-wide"
                >
                  Search Products
                </label>
                <div class="relative">
                  <div
                    class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"
                  >
                    <i class="fas fa-search text-slate-400"></i>
                  </div>
                  <input
                    type="text"
                    x-model="searchQuery"
                    placeholder="Search by name, description, or seller..."
                    class="w-full pl-12 pr-4 py-3 rounded-xl bg-dark-blue-900/50 border border-cyan-500/30 text-slate-100 placeholder-slate-400 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 focus:outline-none transition-all"
                  />
                </div>
              </div>

              <!-- Category -->
              <div>
                <label
                  class="block text-sm font-semibold text-cyan-300 mb-3 uppercase tracking-wide"
                >
                  Category
                </label>
                <select
                  x-model="filterCategory"
                  class="w-full py-3 px-4 rounded-xl bg-dark-blue-900/50 border border-cyan-500/30 text-slate-100 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 focus:outline-none transition-all"
                >
                  <option value="">All Categories</option>
                  <option
                    th:each="category : ${categories}"
                    th:value="${category.id}"
                    th:text="${category.name}"
                  >
                    Electronics
                  </option>
                </select>
              </div>

              <!-- Status -->
              <div>
                <label
                  class="block text-sm font-semibold text-cyan-300 mb-3 uppercase tracking-wide"
                >
                  Status
                </label>
                <select
                  x-model="filterStatus"
                  class="w-full py-3 px-4 rounded-xl bg-dark-blue-900/50 border border-cyan-500/30 text-slate-100 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 focus:outline-none transition-all"
                >
                  <option value="">All Status</option>
                  <option value="PENDING">Pending</option>
                  <option value="APPROVED">Approved</option>
                  <option value="REJECTED">Rejected</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Products Grid -->
        <div
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"
        >
          <div
            th:each="product : ${products}"
            class="product-card rounded-2xl shadow-xl overflow-hidden"
          >
            <!-- Product Image -->
            <div
              class="aspect-w-1 aspect-h-1 w-full overflow-hidden bg-gradient-to-br from-slate-700 to-slate-800"
            >
              <img
                th:src="${product.image}"
                th:alt="${product.name}"
                src="https://images.pexels.com/photos/205421/pexels-photo-205421.jpeg?auto=compress&cs=tinysrgb&w=400"
                class="w-full h-56 object-cover object-center"
              />
              <div class="absolute top-4 right-4 w-28">
                <span
                  th:switch="${product.validity}"
                  class="inline-flex items-center justify-center w-full py-1 rounded-full text-xs font-bold text-white"
                >
                  <span
                    th:case="'pending'"
                    class="bg-yellow-500 text-white text-center rounded-full px-2"
                    >Pending</span
                  >
                  <span
                    th:case="'approved'"
                    class="bg-green-500 text-white text-center rounded-full px-2"
                    >Approved</span
                  >
                  <span
                    th:case="'rejected'"
                    class="bg-red-500 text-white text-center rounded-full px-2"
                    >Rejected</span
                  >
                </span>
              </div>
            </div>

            <!-- Product Info -->
            <div class="p-6">
              <div class="flex items-start justify-between mb-3">
                <h3
                  th:text="${product.name}"
                  class="text-lg font-bold text-white leading-tight"
                >
                  MacBook Pro 13" M2 Chip
                </h3>
              </div>

              <div class="flex items-center justify-between mb-4">
                <p
                  th:text="'$' + ${product.price}"
                  class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-400 bg-clip-text text-transparent"
                >
                  $999
                </p>
                <span
                  th:text="${product.category.name}"
                  class="text-xs text-slate-400 bg-slate-700/50 px-3 py-1 rounded-full border border-slate-600"
                >
                  Electronics
                </span>
              </div>

              <div class="flex items-center mb-4">
                <div
                  class="w-8 h-8 rounded-full bg-gradient-to-br from-cyan-400 to-blue-500 flex items-center justify-center mr-3"
                >
                  <i class="fas fa-user text-white text-xs"></i>
                </div>
                <p
                  th:text="${product.user.name}"
                  class="text-sm text-slate-300"
                >
                  John's Tech Store
                </p>
              </div>

              <!-- Actions -->
              <div class="flex space-x-2">
                <form th:action="@{/admin/products/approve}" method="post">
                  <input
                    type="hidden"
                    name="productId"
                    th:value="${product.id}"
                  />
                  <button
                    th:if="${product.validity == 'pending'}"
                    type="submit"
                    class="flex-1 bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500 text-white text-sm font-semibold py-2.5 px-4 rounded-lg transition-all duration-200 hover:shadow-lg"
                  >
                    <i class="fas fa-check mr-2"></i>Approve
                  </button>
                </form>

                <form th:action="@{/admin/products/reject}" method="post">
                  <input
                    type="hidden"
                    name="productId"
                    th:value="${product.id}"
                  />
                  <button
                    th:if="${product.validity == 'pending'}"
                    type="submit"
                    class="flex-1 bg-gradient-to-r from-red-500 to-red-600 hover:from-red-400 hover:to-red-500 text-white text-sm font-semibold py-2.5 px-4 rounded-lg transition-all duration-200 hover:shadow-lg"
                  >
                    <i class="fas fa-times mr-2"></i>Reject
                  </button>
                </form>

                <button
                  @click="deleteProduct(product.id)"
                  class="bg-gradient-to-r from-slate-600 to-slate-700 hover:from-slate-500 hover:to-slate-600 text-white text-sm font-semibold py-2.5 px-4 rounded-lg transition-all duration-200 hover:shadow-lg"
                >
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Empty State -->
        <div
          class="text-center py-16"
          x-show="products.length === 0"
          style="display: none"
        >
          <div
            class="w-24 h-24 mx-auto mb-6 bg-gradient-to-br from-slate-600 to-slate-700 rounded-full flex items-center justify-center"
          >
            <i class="fas fa-box-open text-slate-400 text-3xl"></i>
          </div>
          <h3 class="text-xl font-semibold text-slate-300 mb-2">
            No products found
          </h3>
          <p class="text-slate-500">
            Try adjusting your search or filter criteria.
          </p>
        </div>
      </div>
    </div>

    <script>
      function productManagement() {
        return {
          showProductModal: false,
          editingProduct: null,
          searchQuery: "",
          filterCategory: "",
          filterStatus: "",
          filterSeller: "",
          productForm: {
            name: "",
            price: "",
            description: "",
            categoryId: "",
            sellerId: "",
            imageUrl: "",
          },

          editProduct(product) {
            this.editingProduct = product;
            this.productForm = { ...product };
            this.showProductModal = true;
          },

          saveProduct() {
            console.log("Saving product:", this.productForm);
            this.showProductModal = false;
            this.resetForm();
          },

          approveProduct(productId) {
            if (confirm("Are you sure you want to approve this product?")) {
              console.log("Approving product:", productId);
            }
          },

          rejectProduct(productId) {
            const reason = prompt("Reason for rejection (optional):");
            console.log("Rejecting product:", productId, "Reason:", reason);
          },

          deleteProduct(productId) {
            if (confirm("Are you sure you want to delete this product?")) {
              console.log("Deleting product:", productId);
            }
          },

          clearFilters() {
            this.searchQuery = "";
            this.filterCategory = "";
            this.filterStatus = "";
            this.filterSeller = "";
          },

          resetForm() {
            this.productForm = {
              name: "",
              price: "",
              description: "",
              categoryId: "",
              sellerId: "",
              imageUrl: "",
            };
            this.editingProduct = null;
          },
        };
      }
    </script>
  </body>
</html>
