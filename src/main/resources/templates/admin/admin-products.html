<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Management - CampusCart Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: "#3D52A0",
                50: "#EDE8F5",
                100: "#ADBBDA",
                200: "#8697C4",
                300: "#7091E6",
                400: "#3D52A0",
                500: "#3D52A0",
                600: "#2F4080",
                700: "#233060",
                800: "#172040",
                900: "#0B1020",
              },
              accent: {
                DEFAULT: "#7091E6",
                50: "#EDE8F5",
                100: "#ADBBDA",
                200: "#8697C4",
                300: "#7091E6",
                400: "#5A7BD9",
                500: "#4365CC",
                600: "#364FA6",
                700: "#293980",
                800: "#1C235A",
                900: "#0F1234",
              },
              surface: {
                light: "#FFFFFF",
                dark: "#2A2E45",
              },
              background: {
                light: "#EDE8F5",
                dark: "#1C1F33",
              },
            },
            animation: {
              "fade-in": "fadeIn 0.5s ease-in-out",
              "slide-up": "slideUp 0.5s ease-out",
              "bounce-gentle": "bounceGentle 2s infinite",
            },
            keyframes: {
              fadeIn: {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" },
              },
              slideUp: {
                "0%": { transform: "translateY(20px)", opacity: "0" },
                "100%": { transform: "translateY(0)", opacity: "1" },
              },
              bounceGentle: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-5px)" },
              },
            },
          },
        },
      };
    </script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
    <style>
      [x-cloak] { display: none !important; }
      body {
        background-color: #EDE8F5;
        min-height: 100vh;
      }
      .product-card {
        background: #FFFFFF;
        border: 1px solid #E5E7EB;
        transition: all 0.3s ease;
      }
      .product-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 24px rgba(61, 82, 160, 0.15);
        border-color: #ADBBDA;
      }
    </style>
  </head>
  <body class="text-gray-800 min-h-screen">
    <div th:insert="admin/admin-layout :: layout('products', ~{::content})">
      <div th:fragment="content" x-data="productManagement()">

        <!-- Page Header -->
        <div class="md:flex md:items-center md:justify-between mb-8">
          <div class="flex-1 min-w-0">
            <h2 class="text-3xl font-bold bg-gradient-to-r from-primary-500 to-accent-400 bg-clip-text text-transparent">
              Product Management
            </h2>
            <p class="mt-2 text-gray-600 text-lg">
              Review and manage all products on the platform
            </p>
          </div>
        </div>

        <!-- Filters Form -->
        <form method="get" action="/admin/products" class="grid grid-cols-1 md:grid-cols-5 gap-6 items-end mb-8">
          <!-- Search -->
          <div class="md:col-span-2">
            <label class="block text-sm font-semibold text-primary-600 mb-3 uppercase tracking-wide">Search Products</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <i class="fas fa-search text-gray-400"></i>
              </div>
              <input type="text" name="search" th:value="${search}" placeholder="Search by name, description, or seller..."
                     class="w-full pl-12 pr-4 py-3 rounded-xl bg-gray-50 border border-gray-300 text-gray-800 placeholder-gray-400 focus:border-primary-400 focus:ring-2 focus:ring-primary-200 focus:outline-none transition-all"/>
            </div>
          </div>

          <!-- Category -->
          <div>
            <label class="block text-sm font-semibold text-primary-600 mb-3 uppercase tracking-wide">Category</label>
            <select name="categoryId"
                    class="w-full py-3 px-4 rounded-xl bg-gray-50 border border-gray-300 text-gray-800 focus:border-primary-400 focus:ring-2 focus:ring-primary-200 focus:outline-none transition-all">
              <option value="">All Categories</option>
              <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"
                      th:selected="${selectedCategory != null and selectedCategory == category.id}"></option>
            </select>
          </div>

          <!-- Status -->
          <div>
            <label class="block text-sm font-semibold text-primary-600 mb-3 uppercase tracking-wide">Status</label>
            <select name="status"
                    class="w-full py-3 px-4 rounded-xl bg-gray-50 border border-gray-300 text-gray-800 focus:border-primary-400 focus:ring-2 focus:ring-primary-200 focus:outline-none transition-all">
              <option value="">All Status</option>
              <option value="pending" th:selected="${selectedStatus == 'pending'}">Pending</option>
              <option value="approved" th:selected="${selectedStatus == 'approved'}">Approved</option>
              <option value="rejected" th:selected="${selectedStatus == 'rejected'}">Rejected</option>
            </select>
          </div>

          <!-- Apply Filters -->
          <div class="md:col-span-1">
            <button type="submit" class="w-full bg-gradient-to-r from-primary-500 to-accent-400 hover:from-primary-600 hover:to-accent-500 text-white py-3 rounded-xl font-semibold shadow-md hover:shadow-lg transition-all">
              Apply Filters
            </button>
          </div>
        </form>

        <!-- Products Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-6">
          <div th:each="product : ${products}" class="product-card rounded-2xl overflow-hidden flex flex-col">
            <!-- Image + Status Badge -->
            <div class="relative w-full h-48">
              <img th:src="${product.image}" th:alt="${product.name}" class="w-full h-full object-cover"/>
              <div class="absolute top-4 right-4">
                <span th:text="${product.validity}"
                      th:classappend="
                        ${product.validity == 'pending'} ? 'bg-yellow-500' :
                        (${product.validity == 'approved'} ? 'bg-green-500' :
                        (${product.validity == 'rejected'} ? 'bg-red-500' : 'bg-gray-500'))"
                      class="inline-block px-3 py-1 rounded-2xl text-sm font-bold text-white shadow"></span>
              </div>
            </div>

            <!-- Info + Actions -->
            <div class="flex-1 flex flex-col p-4">
              <!-- Info -->
              <div class="flex-1">
                <h3 th:text="${product.name}" class="text-lg font-bold text-gray-800 truncate mb-2"></h3>
                <p th:text="'৳' + ${product.price}" class="text-xl font-bold text-primary-600 mb-2"></p>
                <span th:text="${product.category.name}" class="text-xs text-white bg-primary-500 px-2 py-1 rounded-full inline-block mb-3"></span>
                <div class="flex items-center">
                  <div class="w-8 h-8 rounded-full bg-primary-500 flex items-center justify-center mr-3">
                    <i class="fas fa-user text-white text-xs"></i>
                  </div>
                  <p th:text="${product.user.name}" class="text-sm text-gray-700 truncate"></p>
                </div>
              </div>

              <!-- Actions -->
              <div class="flex space-x-2 mt-4">
                <!-- Approve -->
                <form th:action="@{/admin/products/approve}" method="post" class="flex-1">
                  <input type="hidden" name="productId" th:value="${product.id}"/>
                  <button th:if="${product.validity == 'pending'}" type="submit"
                          class="w-full bg-green-600 hover:bg-green-500 text-white py-2 rounded-xl font-semibold text-sm shadow-md hover:shadow-lg transition-all">
                    Approve
                  </button>
                </form>

                <!-- Reject -->
                <form th:action="@{/admin/products/reject}" method="post" class="flex-1">
                  <input type="hidden" name="productId" th:value="${product.id}"/>
                  <button th:if="${product.validity == 'pending'}" type="submit"
                          class="w-full bg-red-600 hover:bg-red-500 text-white py-2 rounded-xl font-semibold text-sm shadow-md hover:shadow-lg transition-all">
                    Reject
                  </button>
                </form>

                <!-- Delete -->
                <form th:action="@{/admin/products/reject}" method="post">
                  <input type="hidden" name="productId" th:value="${product.id}"/>
                  <button type="submit"
                          class="w-10 h-10 flex items-center justify-center bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-xl transition-all">
                    <i class="fas fa-trash"></i>
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>

        <!-- Empty State -->
        <div class="text-center py-16" x-show="products.length === 0" style="display: none">
          <div class="w-24 h-24 mx-auto mb-6 bg-gradient-to-br from-gray-200 to-gray-300 rounded-full flex items-center justify-center">
            <i class="fas fa-box-open text-gray-500 text-3xl"></i>
          </div>
          <h3 class="text-xl font-semibold text-gray-700 mb-2">No products found</h3>
          <p class="text-gray-500">Try adjusting your search or filter criteria.</p>
        </div>

    </div>
  </body>
</html>
