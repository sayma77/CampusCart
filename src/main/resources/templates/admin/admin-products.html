<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Management - CampusCart Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "dark-blue": {
                50: "#f0f9ff",
                100: "#e0f2fe",
                200: "#bae6fd",
                300: "#7dd3fc",
                400: "#38bdf8",
                500: "#0ea5e9",
                600: "#0284c7",
                700: "#0369a1",
                800: "#075985",
                900: "#0c4a6e",
                950: "#082f49",
              },
              midnight: {
                50: "#f8fafc",
                100: "#f1f5f9",
                200: "#e2e8f0",
                300: "#cbd5e1",
                400: "#94a3b8",
                500: "#64748b",
                600: "#475569",
                700: "#334155",
                800: "#1e293b",
                900: "#0f172a",
                950: "#020617",
              },
            },
          },
        },
      };
    </script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
    <style>
      [x-cloak] { display: none !important; }
      body {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0c4a6e 100%);
        min-height: 100vh;
      }
      .product-card {
        background: linear-gradient(135deg, rgba(30,41,59,0.8) 0%, rgba(15,23,42,0.9) 100%);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(56,189,248,0.3);
        transition: all 0.3s ease;
      }
      .product-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 30px rgba(56,189,248,0.4);
        border-color: rgba(56,189,248,0.5);
      }
    </style>
  </head>
  <body class="text-slate-100 min-h-screen">
    <div th:insert="admin/admin-layout :: layout('products', ~{::content})">
      <div th:fragment="content" x-data="productManagement()">

        <!-- Page Header -->
        <div class="md:flex md:items-center md:justify-between mb-8">
          <div class="flex-1 min-w-0">
            <h2 class="text-3xl font-bold bg-gradient-to-r from-cyan-400 to-blue-400 bg-clip-text text-transparent">
              Product Management
            </h2>
            <p class="mt-2 text-slate-400 text-lg">
              Review and manage all products on the platform
            </p>
          </div>
        </div>

        <!-- Filters Form -->
        <form method="get" action="/admin/products" class="grid grid-cols-1 md:grid-cols-5 gap-6 items-end mb-8">
          <!-- Search -->
          <div class="md:col-span-2">
            <label class="block text-sm font-semibold text-cyan-300 mb-3 uppercase tracking-wide">Search Products</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <i class="fas fa-search text-slate-400"></i>
              </div>
              <input type="text" name="search" th:value="${search}" placeholder="Search by name, description, or seller..."
                     class="w-full pl-12 pr-4 py-3 rounded-xl bg-dark-blue-900/50 border border-cyan-500/30 text-slate-100"/>
            </div>
          </div>

          <!-- Category -->
          <div>
            <label class="block text-sm font-semibold text-cyan-300 mb-3 uppercase tracking-wide">Category</label>
            <select name="categoryId"
                    class="w-full py-3 px-4 rounded-xl bg-dark-blue-900/50 border border-cyan-500/30 text-slate-100">
              <option value="">All Categories</option>
              <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"
                      th:selected="${selectedCategory != null and selectedCategory == category.id}"></option>
            </select>
          </div>

          <!-- Status -->
          <div>
            <label class="block text-sm font-semibold text-cyan-300 mb-3 uppercase tracking-wide">Status</label>
            <select name="status"
                    class="w-full py-3 px-4 rounded-xl bg-dark-blue-900/50 border border-cyan-500/30 text-slate-100">
              <option value="">All Status</option>
              <option value="pending" th:selected="${selectedStatus == 'pending'}">Pending</option>
              <option value="approved" th:selected="${selectedStatus == 'approved'}">Approved</option>
              <option value="rejected" th:selected="${selectedStatus == 'rejected'}">Rejected</option>
            </select>
          </div>

          <!-- Apply Filters -->
          <div class="md:col-span-1">
            <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-500 text-white py-3 rounded-xl font-semibold">
              Apply Filters
            </button>
          </div>
        </form>

        <!-- Products Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-6">
          <div th:each="product : ${products}" class="product-card rounded-2xl overflow-hidden flex flex-col">
            <!-- Image + Status Badge -->
            <div class="relative w-full h-48">
              <img th:src="${product.image}" th:alt="${product.name}" class="w-full h-full object-cover"/>
              <div class="absolute top-4 right-4">
                <span th:text="${product.validity}"
                      th:classappend="
                        ${product.validity == 'pending'} ? 'bg-yellow-500' :
                        (${product.validity == 'approved'} ? 'bg-green-500' :
                        (${product.validity == 'rejected'} ? 'bg-red-500' : 'bg-gray-500'))"
                      class="inline-block px-3 py-1 rounded-2xl text-sm font-bold text-white shadow"></span>
              </div>
            </div>

            <!-- Info + Actions -->
            <div class="flex-1 flex flex-col p-4">
              <!-- Info -->
              <div class="flex-1">
                <h3 th:text="${product.name}" class="text-lg font-bold text-white truncate mb-2"></h3>
                <p th:text="'৳' + ${product.price}" class="text-xl font-bold text-cyan-400 mb-2"></p>
                <span th:text="${product.category.name}" class="text-xs text-slate-100 bg-slate-700/80 px-2 py-1 rounded-full inline-block mb-3"></span>
                <div class="flex items-center">
                  <div class="w-8 h-8 rounded-full bg-cyan-600 flex items-center justify-center mr-3">
                    <i class="fas fa-user text-white text-xs"></i>
                  </div>
                  <p th:text="${product.user.name}" class="text-sm text-slate-200 truncate"></p>
                </div>
              </div>

              <!-- Actions -->
              <div class="flex space-x-2 mt-4">
                <!-- Approve -->
                <form th:action="@{/admin/products/approve}" method="post" class="flex-1">
                  <input type="hidden" name="productId" th:value="${product.id}"/>
                  <button th:if="${product.validity == 'pending'}" type="submit"
                          class="w-full bg-green-600 hover:bg-green-500 text-white py-2 rounded-xl font-semibold text-sm">
                    Approve
                  </button>
                </form>

                <!-- Reject -->
                <form th:action="@{/admin/products/reject}" method="post" class="flex-1">
                  <input type="hidden" name="productId" th:value="${product.id}"/>
                  <button th:if="${product.validity == 'pending'}" type="submit"
                          class="w-full bg-red-600 hover:bg-red-500 text-white py-2 rounded-xl font-semibold text-sm">
                    Reject
                  </button>
                </form>

                <!-- Delete -->
                <form th:action="@{/admin/products/delete}" method="post">
                  <input type="hidden" name="productId" th:value="${product.id}"/>
                  <button type="submit"
                          class="w-10 h-10 flex items-center justify-center bg-gray-700 hover:bg-gray-600 text-white rounded-xl">
                    <i class="fas fa-trash"></i>
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>

        <!-- Empty State -->
        <div class="text-center py-16" x-show="products.length === 0" style="display: none">
          <div class="w-24 h-24 mx-auto mb-6 bg-gradient-to-br from-slate-600 to-slate-700 rounded-full flex items-center justify-center">
            <i class="fas fa-box-open text-slate-400 text-3xl"></i>
          </div>
          <h3 class="text-xl font-semibold text-slate-300 mb-2">No products found</h3>
          <p class="text-slate-500">Try adjusting your search or filter criteria.</p>
        </div>

    </div>

  </body>
</html>
