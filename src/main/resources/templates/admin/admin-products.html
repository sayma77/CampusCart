<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Management - CampusCart Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
      defer
    ></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      [x-cloak] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div th:insert="admin/admin-layout :: layout('products', ~{::content})">
      <div th:fragment="content" x-data="productManagement()">
        <!-- Page Header -->
        <div class="md:flex md:items-center md:justify-between mb-6">
          <div class="flex-1 min-w-0">
            <h2 class="text-2xl font-bold leading-7 text-gray-900">
              Product Management
            </h2>
            <p class="mt-1 text-sm text-gray-500">
              Review and manage all products on the platform
            </p>
          </div>
          <div class="mt-4 md:mt-0 md:ml-4 flex space-x-3">
            <button
              @click="showProductModal = true; editingProduct = null"
              class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700"
            >
              <i class="fas fa-plus -ml-1 mr-2 h-4 w-4"></i>
              Add Product
            </button>
          </div>
        </div>

        <!-- Filters -->
        <div class="bg-white shadow rounded-lg mb-6">
          <div class="px-4 py-5 sm:p-6">
            <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2"
                  >Search</label
                >
                <input
                  type="text"
                  x-model="searchQuery"
                  placeholder="Search products..."
                  class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2"
                  >Category</label
                >
                <select
                  x-model="filterCategory"
                  class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                >
                  <option value="">All Categories</option>
                  <option
                    th:each="category : ${categories}"
                    th:value="${category.id}"
                    th:text="${category.name}"
                  >
                    Electronics
                  </option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2"
                  >Status</label
                >
                <select
                  x-model="filterStatus"
                  class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                >
                  <option value="">All Status</option>
                  <option value="PENDING">Pending</option>
                  <option value="APPROVED">Approved</option>
                  <option value="REJECTED">Rejected</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2"
                  >Seller</label
                >
                <select
                  x-model="filterSeller"
                  class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                >
                  <option value="">All Sellers</option>
                  <option
                    th:each="seller : ${sellers}"
                    th:value="${seller.id}"
                    th:text="${seller.name}"
                  >
                    John's Store
                  </option>
                </select>
              </div>
              <div class="flex items-end">
                <button
                  @click="clearFilters()"
                  class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50"
                >
                  Clear Filters
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Products Grid -->
        <div
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
        >
          <div
            th:each="product : ${products}"
            class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition-shadow"
          >
            <!-- Product Image -->
            <div
              class="aspect-w-1 aspect-h-1 w-full overflow-hidden bg-gray-200"
            >
              <img
                th:src="${product.imageUrl}"
                th:alt="${product.name}"
                class="w-full h-48 object-cover object-center"
              />
            </div>

            <!-- Product Info -->
            <div class="p-4">
              <h3
                th:text="${product.name}"
                class="text-sm font-medium text-gray-900 mb-1"
              >
                MacBook Pro 13"
              </h3>
              <p
                th:text="'$' + ${product.price}"
                class="text-lg font-bold text-gray-900 mb-2"
              >
                $999
              </p>
              <p
                th:text="${product.sellerName}"
                class="text-xs text-gray-500 mb-2"
              >
                Sold by: John's Electronics
              </p>

              <!-- Status Badge -->
              <div class="flex items-center justify-between mb-3">
                <!-- <span th:class="'inline-flex px-2 py-1 text-xs font-medium rounded-full ' + 
                                           (${product.status} == 'APPROVED' ? 'bg-green-100 text-green-800' : 
                                            ${product.status} == 'PENDING' ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800')"
                                  th:text="${product.status}">Pending</span> -->
                <span
                  th:text="${product.categoryName}"
                  class="text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded"
                  >Electronics</span
                >
              </div>

              <!-- Actions -->
              <div class="flex space-x-2">
                <button
                  th:if="${product.status == 'PENDING'}"
                  @click="approveProduct(product.id)"
                  th:attr="data-product-id=${product.id}"
                  class="flex-1 bg-green-600 text-white text-xs py-2 px-3 rounded hover:bg-green-700 transition-colors"
                >
                  <i class="fas fa-check mr-1"></i>Approve
                </button>
                <button
                  th:if="${product.status == 'PENDING'}"
                  @click="rejectProduct(product.id)"
                  class="flex-1 bg-red-600 text-white text-xs py-2 px-3 rounded hover:bg-red-700 transition-colors"
                >
                  <i class="fas fa-times mr-1"></i>Reject
                </button>
                <button
                  @click="editProduct(product)"
                  class="flex-1 bg-blue-600 text-white text-xs py-2 px-3 rounded hover:bg-blue-700 transition-colors"
                >
                  <i class="fas fa-edit mr-1"></i>Edit
                </button>
                <button
                  @click="deleteProduct(product.id)"
                  class="bg-gray-600 text-white text-xs py-2 px-3 rounded hover:bg-gray-700 transition-colors"
                >
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Product Modal -->
        <div
          x-show="showProductModal"
          x-cloak
          class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50"
          @click.self="showProductModal = false"
        >
          <div
            class="relative top-10 mx-auto p-5 border w-full max-w-2xl shadow-lg rounded-md bg-white"
          >
            <div class="mt-3">
              <h3
                class="text-lg font-medium text-gray-900 mb-4"
                x-text="editingProduct ? 'Edit Product' : 'Add New Product'"
              >
                Add New Product
              </h3>

              <form @submit.prevent="saveProduct()">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1"
                      >Product Name</label
                    >
                    <input
                      type="text"
                      x-model="productForm.name"
                      required
                      class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                    />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1"
                      >Price</label
                    >
                    <input
                      type="number"
                      x-model="productForm.price"
                      required
                      step="0.01"
                      class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                    />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1"
                      >Category</label
                    >
                    <select
                      x-model="productForm.categoryId"
                      required
                      class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                    >
                      <option value="">Select Category</option>
                      <option
                        th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}"
                      >
                        Electronics
                      </option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1"
                      >Seller</label
                    >
                    <select
                      x-model="productForm.sellerId"
                      required
                      class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                    >
                      <option value="">Select Seller</option>
                      <option
                        th:each="seller : ${sellers}"
                        th:value="${seller.id}"
                        th:text="${seller.name}"
                      >
                        John's Store
                      </option>
                    </select>
                  </div>
                  <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1"
                      >Description</label
                    >
                    <textarea
                      x-model="productForm.description"
                      rows="3"
                      required
                      class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                    ></textarea>
                  </div>
                  <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1"
                      >Image URL</label
                    >
                    <input
                      type="url"
                      x-model="productForm.imageUrl"
                      class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                    />
                  </div>
                </div>

                <div class="flex justify-end space-x-3 mt-6">
                  <button
                    type="button"
                    @click="showProductModal = false"
                    class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700"
                  >
                    <span x-text="editingProduct ? 'Update' : 'Create'"
                      >Create</span
                    >
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function productManagement() {
        return {
          showProductModal: false,
          editingProduct: null,
          searchQuery: "",
          filterCategory: "",
          filterStatus: "",
          filterSeller: "",
          productForm: {
            name: "",
            price: "",
            description: "",
            categoryId: "",
            sellerId: "",
            imageUrl: "",
          },

          editProduct(product) {
            this.editingProduct = product;
            this.productForm = { ...product };
            this.showProductModal = true;
          },

          saveProduct() {
            console.log("Saving product:", this.productForm);
            this.showProductModal = false;
            this.resetForm();
          },

          approveProduct(productId) {
            if (confirm("Are you sure you want to approve this product?")) {
              console.log("Approving product:", productId);
            }
          },

          rejectProduct(productId) {
            const reason = prompt("Reason for rejection (optional):");
            console.log("Rejecting product:", productId, "Reason:", reason);
          },

          deleteProduct(productId) {
            if (confirm("Are you sure you want to delete this product?")) {
              console.log("Deleting product:", productId);
            }
          },

          clearFilters() {
            this.searchQuery = "";
            this.filterCategory = "";
            this.filterStatus = "";
            this.filterSeller = "";
          },

          resetForm() {
            this.productForm = {
              name: "",
              price: "",
              description: "",
              categoryId: "",
              sellerId: "",
              imageUrl: "",
            };
            this.editingProduct = null;
          },
        };
      }
    </script>
  </body>
</html>
