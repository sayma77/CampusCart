<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management - CampusCart Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
      defer
    ></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      [x-cloak] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div th:insert="admin/admin-layout :: layout('users', ~{::content})">
      <div th:fragment="content" x-data="userManagement()">
        <!-- Page Header -->
        <div class="md:flex md:items-center md:justify-between mb-6">
          <div class="flex-1 min-w-0">
            <h2 class="text-2xl font-bold leading-7 text-gray-900">
              User Management
            </h2>
            <p class="mt-1 text-sm text-gray-500">
              Manage all users, roles, and permissions
            </p>
          </div>
        </div>

        <!-- Filters -->
        <div class="bg-white shadow rounded-lg mb-6">
          <div class="px-4 py-5 sm:p-6">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                Search
              </label>
              <input
                type="text"
                x-model="searchQuery"
                @input="filterUsers()"
                placeholder="Search users..."
                class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
              />
            </div>
          </div>
        </div>

        <!-- Users Table -->
        <div class="bg-white shadow rounded-lg overflow-hidden">
          <div class="min-w-full divide-y divide-gray-200">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50">
                <tr>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                  >
                    User
                  </th>
                  <th
                    class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider"
                  >
                    Actions
                  </th>
                </tr>
              </thead>
              <tbody class="bg-white divide-y divide-gray-200">
                <tr th:each="user : ${users}" class="hover:bg-gray-50">
                  <!-- User info -->
                  <td class="px-6 py-4 whitespace-nowrap">
                    <div class="flex items-center">
                      <div
                        class="h-10 w-10 rounded-full bg-gray-300 flex items-center justify-center"
                      >
                        <span
                          th:text="${user.initials}"
                          class="text-sm font-medium text-gray-700"
                          >JD</span
                        >
                      </div>
                      <div class="ml-4">
                        <div
                          th:text="${user.name}"
                          class="text-sm font-medium text-gray-900"
                        >
                          John Doe
                        </div>
                        <div
                          th:text="${user.email}"
                          class="text-sm text-gray-500"
                        >
                          john@example.com
                        </div>
                      </div>
                    </div>
                  </td>

                  <!-- Actions -->
                  <td
                    class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-2 text-right"
                  >
                    <button
                      @click="editUser(user)"
                      th:attr="data-user-id=${user.id}"
                      class="text-blue-600 hover:text-blue-900"
                    >
                      Edit
                    </button>

                    <button
                      @click="deleteUser(user.id)"
                      class="text-red-600 hover:text-red-900"
                    >
                      Delete
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div
            class="bg-white px-4 py-3 flex items-center justify-between border-t border-gray-200 sm:px-6"
          >
            <div class="flex-1 flex justify-between sm:hidden">
              <button
                th:disabled="${currentPage == 1}"
                class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 disabled:bg-gray-100 disabled:text-gray-400"
              >
                Previous
              </button>
              <button
                th:disabled="${currentPage == totalPages}"
                class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 disabled:bg-gray-100 disabled:text-gray-400"
              >
                Next
              </button>
            </div>
            <div
              class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between"
            >
              <div>
                <p class="text-sm text-gray-700">
                  Showing
                  <span th:text="${startIndex}" class="font-medium">1</span> to
                  <span th:text="${endIndex}" class="font-medium">10</span> of
                  <span th:text="${totalUsers}" class="font-medium">97</span>
                  results
                </p>
              </div>
              <div>
                <nav
                  class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px"
                >
                  <button
                    th:each="page : ${#numbers.sequence(1, totalPages)}"
                    th:text="${page}"
                    th:class="${page == currentPage} ? 'bg-blue-50 border-blue-500 text-blue-600' : 'bg-white border-gray-300 text-gray-500 hover:bg-gray-50'"
                    class="relative inline-flex items-center px-4 py-2 border text-sm font-medium"
                  >
                    1
                  </button>
                </nav>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function userManagement() {
        return {
          showUserModal: false,
          editingUser: null,
          searchQuery: "",
          filterRole: "",
          filterStatus: "",
          userForm: {
            name: "",
            email: "",
            role: "",
            password: "",
          },

          editUser(user) {
            this.editingUser = user;
            this.userForm = { ...user };
            this.showUserModal = true;
          },

          saveUser() {
            // Implementation would send data to backend
            console.log("Saving user:", this.userForm);
            this.showUserModal = false;
            this.resetForm();
          },

          deleteUser(userId) {
            if (confirm("Are you sure you want to delete this user?")) {
              // Implementation would delete user
              console.log("Deleting user:", userId);
            }
          },

          toggleUserStatus(userId, currentStatus) {
            const action = currentStatus === "ACTIVE" ? "block" : "unblock";
            if (confirm(`Are you sure you want to ${action} this user?`)) {
              // Implementation would toggle user status
              console.log(`${action} user:`, userId);
            }
          },

          filterUsers() {
            // Implementation would filter users based on search and filters
            console.log("Filtering users:", {
              search: this.searchQuery,
              role: this.filterRole,
              status: this.filterStatus,
            });
          },

          clearFilters() {
            this.searchQuery = "";
            this.filterRole = "";
            this.filterStatus = "";
            this.filterUsers();
          },

          resetForm() {
            this.userForm = {
              name: "",
              email: "",
              role: "",
              password: "",
            };
            this.editingUser = null;
          },
        };
      }
    </script>
  </body>
</html>
