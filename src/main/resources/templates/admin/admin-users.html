<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - CampusCart Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body>
    <div th:insert="admin/admin-layout :: layout('users', ~{::content})">
        <div th:fragment="content" x-data="userManagement()">
            <!-- Page Header -->
            <div class="md:flex md:items-center md:justify-between mb-6">
                <div class="flex-1 min-w-0">
                    <h2 class="text-2xl font-bold leading-7 text-gray-900">User Management</h2>
                    <p class="mt-1 text-sm text-gray-500">Manage all users, roles, and permissions</p>
                </div>
                <div class="mt-4 md:mt-0 md:ml-4">
                    <button @click="showUserModal = true; editingUser = null" 
                            class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <i class="fas fa-plus -ml-1 mr-2 h-4 w-4"></i>
                        Add User
                    </button>
                </div>
            </div>

            <!-- Filters -->
            <div class="bg-white shadow rounded-lg mb-6">
                <div class="px-4 py-5 sm:p-6">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Search</label>
                            <input type="text" 
                                   x-model="searchQuery"
                                   @input="filterUsers()"
                                   placeholder="Search users..."
                                   class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Role</label>
                            <select x-model="filterRole" @change="filterUsers()" 
                                    class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                                <option value="">All Roles</option>
                                <option value="ADMIN">Admin</option>
                                <option value="SELLER">Seller</option>
                                <option value="BUYER">Buyer</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
                            <select x-model="filterStatus" @change="filterUsers()" 
                                    class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                                <option value="">All Status</option>
                                <option value="ACTIVE">Active</option>
                                <option value="BLOCKED">Blocked</option>
                            </select>
                        </div>
                        <div class="flex items-end">
                            <button @click="clearFilters()" 
                                    class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                Clear Filters
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Users Table -->
            <div class="bg-white shadow rounded-lg overflow-hidden">
                <div class="min-w-full divide-y divide-gray-200">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">User</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Role</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Joined</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            <tr th:each="user : ${users}" class="hover:bg-gray-50">
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="flex items-center">
                                        <div class="h-10 w-10 rounded-full bg-gray-300 flex items-center justify-center">
                                            <span th:text="${user.initials}" class="text-sm font-medium text-gray-700">JD</span>
                                        </div>
                                        <div class="ml-4">
                                            <div th:text="${user.name}" class="text-sm font-medium text-gray-900">John Doe</div>
                                            <div th:text="${user.email}" class="text-sm text-gray-500">john@example.com</div>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <!-- <span th:class="'inline-flex px-2 py-1 text-xs font-medium rounded-full ' + 
                                                   (${user.role} == 'ADMIN' ? 'bg-purple-100 text-purple-800' : 
                                                    ${user.role} == 'SELLER' ? 'bg-green-100 text-green-800' : 'bg-blue-100 text-blue-800')"
                                          th:text="${user.role}">Buyer</span> -->
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span th:class="'inline-flex px-2 py-1 text-xs font-medium rounded-full ' + 
                                                   (${user.status} == 'ACTIVE' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800')"
                                          th:text="${user.status}">Active</span>
                                </td>
                                <td th:text="${user.joinedDate}" class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">Jan 15, 2024</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-2">
                                    <button @click="editUser(user)" 
                                            th:attr="data-user-id=${user.id}"
                                            class="text-blue-600 hover:text-blue-900">Edit</button>
                                    <button @click="toggleUserStatus(user.id, user.status)" 
                                            th:text="${user.status == 'ACTIVE'} ? 'Block' : 'Unblock'"
                                            th:class="${user.status == 'ACTIVE'} ? 'text-red-600 hover:text-red-900' : 'text-green-600 hover:text-green-900'">Block</button>
                                    <button @click="deleteUser(user.id)" 
                                            class="text-red-600 hover:text-red-900">Delete</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="bg-white px-4 py-3 flex items-center justify-between border-t border-gray-200 sm:px-6">
                    <div class="flex-1 flex justify-between sm:hidden">
                        <button th:disabled="${currentPage == 1}" 
                                class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 disabled:bg-gray-100 disabled:text-gray-400">
                            Previous
                        </button>
                        <button th:disabled="${currentPage == totalPages}" 
                                class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 disabled:bg-gray-100 disabled:text-gray-400">
                            Next
                        </button>
                    </div>
                    <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
                        <div>
                            <p class="text-sm text-gray-700">
                                Showing <span th:text="${startIndex}" class="font-medium">1</span> to 
                                <span th:text="${endIndex}" class="font-medium">10</span> of 
                                <span th:text="${totalUsers}" class="font-medium">97</span> results
                            </p>
                        </div>
                        <div>
                            <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px">
                                <button th:each="page : ${#numbers.sequence(1, totalPages)}" 
                                        th:text="${page}"
                                        th:class="${page == currentPage} ? 'bg-blue-50 border-blue-500 text-blue-600' : 'bg-white border-gray-300 text-gray-500 hover:bg-gray-50'"
                                        class="relative inline-flex items-center px-4 py-2 border text-sm font-medium">1</button>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>

            <!-- User Modal -->
            <div x-show="showUserModal" x-cloak
                 class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50"
                 @click.self="showUserModal = false">
                <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
                    <div class="mt-3">
                        <h3 class="text-lg font-medium text-gray-900 mb-4" x-text="editingUser ? 'Edit User' : 'Add New User'">Add New User</h3>
                        
                        <form @submit.prevent="saveUser()">
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                                    <input type="text" x-model="userForm.name" required
                                           class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                    <input type="email" x-model="userForm.email" required
                                           class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
                                    <select x-model="userForm.role" required
                                            class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                                        <option value="">Select Role</option>
                                        <option value="ADMIN">Admin</option>
                                        <option value="SELLER">Seller</option>
                                        <option value="BUYER">Buyer</option>
                                    </select>
                                </div>
                                <div x-show="!editingUser">
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                    <input type="password" x-model="userForm.password" :required="!editingUser"
                                           class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                                </div>
                            </div>
                            
                            <div class="flex justify-end space-x-3 mt-6">
                                <button type="button" @click="showUserModal = false"
                                        class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                                    Cancel
                                </button>
                                <button type="submit"
                                        class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">
                                    <span x-text="editingUser ? 'Update' : 'Create'">Create</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function userManagement() {
            return {
                showUserModal: false,
                editingUser: null,
                searchQuery: '',
                filterRole: '',
                filterStatus: '',
                userForm: {
                    name: '',
                    email: '',
                    role: '',
                    password: ''
                },
                
                editUser(user) {
                    this.editingUser = user;
                    this.userForm = { ...user };
                    this.showUserModal = true;
                },
                
                saveUser() {
                    // Implementation would send data to backend
                    console.log('Saving user:', this.userForm);
                    this.showUserModal = false;
                    this.resetForm();
                },
                
                deleteUser(userId) {
                    if (confirm('Are you sure you want to delete this user?')) {
                        // Implementation would delete user
                        console.log('Deleting user:', userId);
                    }
                },
                
                toggleUserStatus(userId, currentStatus) {
                    const action = currentStatus === 'ACTIVE' ? 'block' : 'unblock';
                    if (confirm(`Are you sure you want to ${action} this user?`)) {
                        // Implementation would toggle user status
                        console.log(`${action} user:`, userId);
                    }
                },
                
                filterUsers() {
                    // Implementation would filter users based on search and filters
                    console.log('Filtering users:', {
                        search: this.searchQuery,
                        role: this.filterRole,
                        status: this.filterStatus
                    });
                },
                
                clearFilters() {
                    this.searchQuery = '';
                    this.filterRole = '';
                    this.filterStatus = '';
                    this.filterUsers();
                },
                
                resetForm() {
                    this.userForm = {
                        name: '',
                        email: '',
                        role: '',
                        password: ''
                    };
                    this.editingUser = null;
                }
            }
        }
    </script>
</body>
</html>
