<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management - CampusCart Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: "#3D52A0",
                50: "#EDE8F5",
                100: "#ADBBDA",
                200: "#8697C4",
                300: "#7091E6",
                400: "#3D52A0",
                500: "#3D52A0",
                600: "#2F4080",
                700: "#233060",
                800: "#172040",
                900: "#0B1020",
              },
              accent: {
                DEFAULT: "#7091E6",
                50: "#EDE8F5",
                100: "#ADBBDA",
                200: "#8697C4",
                300: "#7091E6",
                400: "#5A7BD9",
                500: "#4365CC",
                600: "#364FA6",
                700: "#293980",
                800: "#1C235A",
                900: "#0F1234",
              },
              surface: {
                light: "#FFFFFF",
                dark: "#2A2E45",
              },
              background: {
                light: "#EDE8F5",
                dark: "#1C1F33",
              },
            },
            animation: {
              "fade-in": "fadeIn 0.5s ease-in-out",
              "slide-up": "slideUp 0.5s ease-out",
              "bounce-gentle": "bounceGentle 2s infinite",
            },
            keyframes: {
              fadeIn: {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" },
              },
              slideUp: {
                "0%": { transform: "translateY(20px)", opacity: "0" },
                "100%": { transform: "translateY(0)", opacity: "1" },
              },
              bounceGentle: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-5px)" },
              },
            },
          },
        },
      };
    </script>
    <script
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
      defer
    ></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      [x-cloak] {
        display: none !important;
      }
      body {
        background-color: #EDE8F5;
        min-height: 100vh;
      }
    </style>
  </head>
  <body class="text-gray-800 min-h-screen">
    <div th:insert="admin/admin-layout :: layout('users', ~{::content})">
      <div th:fragment="content" x-data="userManagement()">
        <!-- Page Header -->
        <div class="md:flex md:items-center md:justify-between mb-8">
          <div class="flex-1 min-w-0">
            <h2
              class="text-3xl font-bold bg-gradient-to-r from-primary-500 to-accent-400 bg-clip-text text-transparent"
            >
              User Management
            </h2>
            <p class="mt-2 text-gray-600 text-lg">
              Manage and monitor all CampusCart users
            </p>
          </div>
        </div>

        <!-- Search and Filters -->
        <div class="bg-white rounded-2xl mb-8 border border-gray-200 shadow-md">
          <div class="px-8 py-6">
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"
              >
                <i class="fas fa-search text-gray-400"></i>
              </div>
              <input
                type="text"
                x-model="searchQuery"
                @input="filterUsers()"
                placeholder="Search users by name, email, or role..."
                class="w-full pl-12 pr-4 py-4 rounded-xl bg-gray-50 border border-gray-300 text-gray-800 placeholder-gray-400 focus:border-primary-400 focus:ring-2 focus:ring-primary-200 focus:outline-none transition-all"
              />
            </div>
          </div>
        </div>

        <!-- Users Table -->
        <div
          class="bg-white rounded-2xl overflow-hidden border border-gray-200 shadow-md"
        >
          <div class="overflow-x-auto">
            <table class="min-w-full">
              <thead>
                <tr>
                  <th
                    class="px-8 py-6 text-left text-sm font-semibold text-primary-600 uppercase tracking-wider border-b border-gray-200 bg-gray-50"
                  >
                    User Information
                  </th>
                  <th
                    class="px-8 py-6 text-right text-sm font-semibold text-primary-600 uppercase tracking-wider border-b border-gray-200 bg-gray-50"
                  >
                    Actions
                  </th>
                </tr>
              </thead>

              <tbody class="divide-y divide-gray-200">
                <tr
                  th:each="user : ${users}"
                  class="hover:bg-gray-50 transition-colors"
                >
                  <!-- User info -->
                  <td class="px-8 py-6 whitespace-nowrap">
                    <div class="flex items-center">
                      <div class="ml-6">
                        <div
                          th:text="${user.name}"
                          class="text-lg font-semibold text-gray-800"
                        >
                          John Doe
                        </div>
                        <div
                          th:text="${user.email}"
                          class="text-gray-600 mt-1"
                        >
                          john@example.com
                        </div>
                        <div class="flex items-center mt-2">
                          <span
                            class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-primary-100 text-primary-700"
                          >
                            <i class="fas fa-graduation-cap mr-2"></i>
                            Student
                          </span>
                        </div>
                      </div>
                    </div>
                  </td>

                  <!-- Actions -->
                  <td class="px-8 py-6 whitespace-nowrap text-right">
                    <form
                      th:action="@{/admin/users/delete}"
                      method="post"
                      onsubmit="return confirm('Are you sure you want to delete this user?')"
                      class="inline"
                    >
                      <!-- Hidden input to pass user ID -->
                      <input type="hidden" name="id" th:value="${user.id}" />

                      <!-- Styled delete button -->
                      <button
                        type="submit"
                        class="inline-flex items-center px-4 py-2 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white text-sm font-medium rounded-lg transition-all duration-200 shadow-md hover:shadow-lg"
                      >
                        <i class="fas fa-trash mr-2"></i>
                        Delete
                      </button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div
            class="bg-gray-50 px-8 py-4 flex items-center justify-between border-t border-gray-200"
          >
            <div class="flex-1 flex justify-between sm:hidden">
              <button
                th:disabled="${currentPage == 1}"
                class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-50 disabled:bg-gray-100 disabled:text-gray-400 transition-colors"
              >
                Previous
              </button>
              <button
                th:disabled="${currentPage == totalPages}"
                class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-50 disabled:bg-gray-100 disabled:text-gray-400 transition-colors"
              >
                Next
              </button>
            </div>
            <div
              class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between"
            >
              <div>
                <p class="text-gray-600">
                  Showing
                  <span th:text="${startIndex}" class="font-semibold text-gray-800"
                    >1</span
                  >
                  to
                  <span th:text="${endIndex}" class="font-semibold text-gray-800"
                    >10</span
                  >
                  of
                  <span th:text="${totalUsers}" class="font-semibold text-gray-800"
                    >97</span
                  >
                  results
                </p>
              </div>
              <div>
                <nav
                  class="relative z-0 inline-flex rounded-lg shadow-sm -space-x-px"
                >
                  <button
                    th:each="page : ${#numbers.sequence(1, totalPages)}"
                    th:text="${page}"
                    th:class="${page == currentPage} ? 'bg-gradient-to-r from-primary-500 to-accent-400 border-primary-500 text-white' : 'bg-white border-gray-300 text-gray-700 hover:bg-gray-50'"
                    class="relative inline-flex items-center px-4 py-2 border text-sm font-medium transition-colors"
                  >
                    1
                  </button>
                </nav>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function userManagement() {
        return {
          showUserModal: false,
          editingUser: null,
          searchQuery: "",
          filterRole: "",
          filterStatus: "",
          userForm: {
            name: "",
            email: "",
            role: "",
            password: "",
          },

          editUser(user) {
            this.editingUser = user;
            this.userForm = { ...user };
            this.showUserModal = true;
          },

          saveUser() {
            console.log("Saving user:", this.userForm);
            this.showUserModal = false;
            this.resetForm();
          },

          deleteUser(userId) {
            if (confirm("Are you sure you want to delete this user?")) {
              console.log("Deleting user:", userId);
            }
          },

          toggleUserStatus(userId, currentStatus) {
            const action = currentStatus === "ACTIVE" ? "block" : "unblock";
            if (confirm(`Are you sure you want to ${action} this user?`)) {
              console.log(`${action} user:`, userId);
            }
          },

          filterUsers() {
            console.log("Filtering users:", {
              search: this.searchQuery,
              role: this.filterRole,
              status: this.filterStatus,
            });
          },

          clearFilters() {
            this.searchQuery = "";
            this.filterRole = "";
            this.filterStatus = "";
            this.filterUsers();
          },

          resetForm() {
            this.userForm = {
              name: "",
              email: "",
              role: "",
              password: "",
            };
            this.editingUser = null;
          },
        };
      }
    </script>
  </body>
</html>
