<div th:fragment="navbar">
  <nav
    class="bg-white/80 dark:bg-surface-dark/80 backdrop-blur-md border-b border-primary-100/20 dark:border-accent/20 sticky top-0 z-50 transition-all duration-300"
  >
    <div class="max-w-8xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <!-- Logo -->
        <div class="flex items-center">
          <!-- <i data-lucide="package" class="h-8 w-8 text-primary mr-2"></i> -->
          <a
            href="/"
            class="text-2xl font-bold text-primary dark:text-accent hover:text-accent transition-colors duration-200"
          >
            CampusCart
          </a>
        </div>

        <!-- Navigation Links -->
        <div
          class="hidden md:flex items-center space-x-8 ml-8 mr-auto"
          id="nav-links"
        >
          <a
            href="/marketplace"
            class="text-primary dark:text-primary-50 hover:text-accent transition-colors duration-200"
          >
            Marketplace
          </a>
        </div>

        <!-- Actions -->
        <div class="flex items-center space-x-4">
          <!-- Theme Toggle -->
          <button
            onclick="toggleTheme()"
            class="p-2 rounded-lg bg-primary-100/20 dark:bg-accent/20 hover:bg-primary-100/40 dark:hover:bg-accent/40 transition-all duration-200"
          >
            <i
              data-lucide="sun"
              class="h-5 w-5 text-primary dark:text-primary-50 dark:hidden"
            ></i>
            <i
              data-lucide="moon"
              class="h-5 w-5 text-primary dark:text-primary-50 hidden dark:block"
            ></i>
          </button>

          <!-- User Actions -->
          <div class="flex items-center space-x-2">
            <!-- Wishlist -->
            <a
              href="/wishlist"
              class="relative p-2 rounded-lg hover:bg-primary-100/20 dark:hover:bg-accent/20 transition-all duration-200"
            >
              <i
                data-lucide="heart"
                class="h-5 w-5 text-primary dark:text-primary-50"
              ></i>
              <span
                th:if="${wishlist_count > 0}"
                class="absolute -top-1 -right-1 bg-accent text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-medium"
                th:text="${wishlist_count}"
              ></span>
            </a>

            <!-- Cart -->
            <a
              href="/cart"
              class="relative p-2 rounded-lg hover:bg-primary-100/20 dark:hover:bg-accent/20 transition-all duration-200"
            >
              <i
                data-lucide="shopping-cart"
                class="h-5 w-5 text-primary dark:text-primary-50"
              ></i>
              <span
                th:if="${cart_item_count > 0}"
                class="absolute -top-1 -right-1 bg-accent text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-medium"
                th:text="${cart_item_count}"
              ></span>
            </a>

            <!-- User Menu -->
            <!-- When NOT authenticated -->
            <li sec:authorize="!isAuthenticated()" class="list-none">
              <a
                href="/signin"
                class="p-2 rounded-lg hover:bg-primary-100/20 dark:hover:bg-accent/20 transition-all duration-200 flex items-center space-x-1"
              >
                <i
                  data-lucide="log-in"
                  class="h-5 w-5 text-primary dark:text-primary-50"
                ></i>
                <span
                  class="hidden md:inline text-primary dark:text-primary-50 font-medium"
                  >Login</span
                >
              </a>
            </li>

            <!-- When authenticated -->
            <li sec:authorize="isAuthenticated()" class="list-none">
              <div class="relative group">
                <button
                  class="p-2 rounded-lg hover:bg-primary-100/20 dark:hover:bg-accent/20 transition-all duration-200 flex items-center space-x-1"
                >
                  <i
                    data-lucide="user"
                    class="h-5 w-5 text-primary dark:text-primary-50"
                  ></i>
                  <i
                    data-lucide="chevron-down"
                    class="h-4 w-4 text-primary dark:text-primary-50"
                  ></i>
                </button>
                <!-- Dropdown Menu -->
                <div
                  class="absolute right-0 mt-2 w-48 bg-white dark:bg-surface-dark rounded-lg shadow-lg border border-primary-100/20 dark:border-accent/20 opacity-0 group-hover:opacity-100 invisible group-hover:visible transition-all duration-200 z-50"
                >
                  <a
                    href="/profile"
                    class="block px-4 py-2 text-primary dark:text-primary-50 hover:bg-primary-100/20 dark:hover:bg-accent/20"
                    >Profile</a
                  >
                  <!-- Uncomment if needed -->
                  <!-- <a href="/orders" class="block px-4 py-2 text-primary dark:text-primary-50 hover:bg-primary-100/20 dark:hover:bg-accent/20">Orders</a> -->
                  <form th:action="@{/signout}" method="post">
                    <button
                      type="submit"
                      class="w-full text-left px-4 py-2 text-red-600 dark:text-red-400 hover:bg-red-100 dark:hover:bg-red-800 rounded-b-lg"
                    >
                      Logout
                    </button>
                  </form>
                </div>
              </div>
            </li>
          </div>
        </div>
      </div>
    </div>
  </nav>
</div>
