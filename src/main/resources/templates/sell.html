<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout :: head}"> </head>
  <body th:replace="~{layout :: layout}" class="bg-base-100 text-gray-800">
    <main>
      <div class="max-w-3xl mx-auto p-6">
        <!-- Sell Form Section -->
        <div class="min-h-screen flex items-start justify-center bg-[#FFFDF9]">
          <div class="w-full max-w-2xl bg-[#FFF7EC] shadow rounded-xl p-8">
            <h1 class="text-2xl font-bold text-[#A7727D] mb-6">
              Post a Product for Sale or Rent
            </h1>
            <form
              method="post"
              th:action="@{/sell}"
              th:object="${product}"
              class="space-y-4"
            >
              <!-- Product Name -->
              <div>
                <label class="block text-[#7c6a6a] mb-1">Product Name</label>
                <input
                  type="text"
                  th:field="*{name}"
                  placeholder="Enter product name"
                  class="w-full px-4 py-2 border border-[#EDDBC7] rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-[#D4A373] transition duration-200"
                  required
                />
              </div>

              <!-- Price -->
              <div>
                <label class="block text-[#7c6a6a] mb-1">Price (৳)</label>
                <input
                  type="number"
                  th:field="*{price}"
                  placeholder="Enter price"
                  class="w-full px-4 py-2 border border-[#EDDBC7] rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-[#D4A373] transition duration-200"
                  min="0"
                  required
                />
              </div>

              <!-- Condition -->
              <div>
                <label class="block text-[#7c6a6a] mb-1">Condition</label>
                <input
                  type="text"
                  th:field="*{status}"
                  placeholder="New, Used, etc."
                  class="w-full px-4 py-2 border border-[#EDDBC7] rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-[#D4A373] transition duration-200"
                  required
                />
              </div>

              <!-- Sell or Rent -->
              <div>
                <label class="block text-[#7c6a6a] mb-1">Type</label>
                <div class="relative">
                  <select
                    th:field="*{sellOrRent}"
                    class="w-full appearance-none px-4 py-2 border border-[#EDDBC7] rounded-2xl focus:outline-none focus:ring-2 focus:ring-[#D4A373] transition duration-200 cursor-pointer shadow-sm"
                    required
                  >
                    <option value="">Select Type</option>
                    <option value="sell">Sell</option>
                    <option value="rent">Rent</option>
                  </select>

                  <!-- Custom Dropdown Icon -->
                  <div
                    class="absolute inset-y-0 right-3 flex items-center pointer-events-none"
                  >
                    <svg
                      class="w-5 h-5 text-[#D4A373]"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M19 9l-7 7-7-7"
                      />
                    </svg>
                  </div>
                </div>
              </div>

              <!-- Category -->
              <div>
                <label class="block text-[#7c6a6a] mb-1">Category</label>
                <div class="relative">
                  <select
                    th:field="*{category}"
                    class="w-full appearance-none px-4 py-2 border border-[#EDDBC7] rounded-2xl focus:outline-none focus:ring-2 focus:ring-[#D4A373] transition duration-200 cursor-pointer shadow-sm"
                    required
                  >
                    <option value="">Select Category</option>
                    <option
                      th:each="cat : ${categories}"
                      th:value="${cat.name}"
                      th:text="${cat.name}"
                    ></option>
                  </select>

                  <!-- Custom Dropdown Icon -->
                  <div
                    class="absolute inset-y-0 right-3 flex items-center pointer-events-none"
                  >
                    <svg
                      class="w-5 h-5 text-[#D4A373]"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M19 9l-7 7-7-7"
                      />
                    </svg>
                  </div>
                </div>
              </div>

              <!-- Image URL -->
              <div>
                <label class="block text-[#7c6a6a] mb-1">Image URL</label>
                <input
                  type="text"
                  th:field="*{image}"
                  placeholder="Enter image URL"
                  class="w-full px-4 py-2 border border-[#EDDBC7] rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-[#D4A373] transition duration-200"
                />
              </div>

              <!-- Hidden Fields -->
              <input type="hidden" th:field="*{categoryId}" />
              <input type="hidden" th:field="*{userId}" />
              <!-- Submit Button -->
              <button
                type="submit"
                class="w-full bg-[#D4A373] text-white py-2 rounded font-semibold hover:bg-[#c28b5f] transition"
              >
                <i class="fas fa-plus mr-1"></i>Post Item
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>

    <script>
      function previewImage() {
        const url = document.getElementById("imageUrl").value.trim();
        const preview = document.getElementById("imagePreview");
        preview.innerHTML = "";
        if (url) {
          const img = document.createElement("img");
          img.src = url;
          img.alt = "Preview";
          img.className =
            "w-32 h-32 object-cover rounded border border-[#D4A373]";
          preview.appendChild(img);
        }
      }
    </script>
  </body>
</html>
