<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - CampusCart</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
        .profile-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .hall-dropdown {
            max-height: 200px;
            overflow-y: auto;
        }
        .order-card {
            transition: all 0.3s ease;
        }
        .taka-symbol::before {
            content: '৳';
            margin-right: 2px;
        }
    </style>
</head>

<body th:replace="~{layout :: layout}" class="bg-gray-50 min-h-screen">
    <main>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Profile Information -->
                <div class="lg:col-span-1">
                    <div class="profile-card rounded-2xl p-6 text-white mb-6">
                        <div class="text-center">
                            <div class="w-24 h-24 bg-white bg-opacity-20 rounded-full mx-auto mb-4 flex items-center justify-center">
                                <i class="fas fa-user text-3xl text-white"></i>
                            </div>
                            <h2 class="text-xl font-bold mb-2" th:text="${user.username}">John Doe</h2>
                            <p class="text-blue-100" th:text="${user.email}">john.doe@student.cuet.ac.bd</p>
                        </div>
                    </div>

                    <!-- Profile Form -->
                    <div class="bg-white rounded-2xl shadow-lg p-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-6">Profile Information</h3>
                        
                        <form th:action="@{/profile/update}" method="post">
                            <!-- CUET Email -->
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">CUET Email</label>
                                <div class="relative">
                                    <input type="email" 
                                           name="email"
                                           th:value="${user.email}"
                                           pattern=".*@student\.cuet\.ac\.bd$"
                                           title="Please use your CUET student email"
                                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                           placeholder="your.name@student.cuet.ac.bd">
                                    <i class="fas fa-envelope absolute right-3 top-3 text-gray-400"></i>
                                </div>
                            </div>

                            <!-- Username -->
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                                <div class="relative">
                                    <input type="text" 
                                           name="username"
                                           th:value="${user.username}"
                                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                           placeholder="Enter username">
                                    <i class="fas fa-user absolute right-3 top-3 text-gray-400"></i>
                                </div>
                            </div>

                            <!-- Location (Hall) -->
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Hall/Location</label>
                                <div class="relative">
                                    <select name="location" 
                                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent appearance-none bg-white">
                                        <option value="">Select Your Hall</option>
                                        <option value="qk_hall" th:selected="${user.location == 'qk_hall'}">QK Hall</option>
                                        <option value="north_hall" th:selected="${user.location == 'north_hall'}">North Hall</option>
                                        <option value="south_hall" th:selected="${user.location == 'south_hall'}">South Hall</option>
                                        <option value="bb_hall" th:selected="${user.location == 'bb_hall'}">BB Hall</option>
                                        <option value="shamshen_nahar_hall" th:selected="${user.location == 'shamshen_nahar_hall'}">Shamshen Nahar Hall</option>
                                        <option value="rabeya_hall" th:selected="${user.location == 'rabeya_hall'}">Rabeya Hall</option>
                                        <option value="sufiya_kamal_hall" th:selected="${user.location == 'sufiya_kamal_hall'}">Sufiya Kamal Hall</option>
                                    </select>
                                    <i class="fas fa-map-marker-alt absolute right-3 top-3 text-gray-400 pointer-events-none"></i>
                                </div>
                            </div>

                            <!-- Password -->
                            <div class="mb-6">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                                <div class="relative">
                                    <input type="password" 
                                           name="password"
                                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                           placeholder="Enter new password">
                                    <i class="fas fa-lock absolute right-3 top-3 text-gray-400"></i>
                                </div>
                            </div>

                            <button type="submit" 
                                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition-colors">
                                Update Profile
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Orders/Items List -->
                <div class="lg:col-span-2">
                    <div class="bg-white rounded-2xl shadow-lg p-6">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-lg font-semibold text-gray-900">My Orders & Items</h3>
                            <div class="flex space-x-2">
                                <button class="filter-btn px-3 py-1 bg-blue-100 text-blue-600 rounded-full text-sm font-medium hover:bg-blue-200 transition-colors" data-filter="all">All</button>
                                <button class="filter-btn px-3 py-1 bg-gray-100 text-gray-600 rounded-full text-sm hover:bg-gray-200 transition-colors" data-filter="buy">Buy</button>
                                <button class="filter-btn px-3 py-1 bg-gray-100 text-gray-600 rounded-full text-sm hover:bg-gray-200 transition-colors" data-filter="sell">Sell</button>
                                <button class="filter-btn px-3 py-1 bg-gray-100 text-gray-600 rounded-full text-sm hover:bg-gray-200 transition-colors" data-filter="rent">Rent</button>
                            </div>
                        </div>

                        <!-- Orders List -->
                        <div class="space-y-4">
                            <!-- Dynamic Order Items -->
                            <div th:each="order : ${userOrders}" 
                                 class="order-card bg-gray-50 rounded-lg p-4 border border-gray-200 transition-all transform hover:-translate-y-0.5 hover:shadow-lg">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center space-x-4">
                                        <div class="w-16 h-16 bg-gray-300 rounded-lg flex items-center justify-center hover:bg-gray-400 transition-colors">
                                            <i class="fas fa-box text-gray-500 text-xl"></i>
                                        </div>
                                        <div>
                                            <h4 class="font-medium text-gray-900" th:text="${order.itemName}">Item Name</h4>
                                            <p class="text-sm text-gray-600" th:text="${order.description}">Description</p>
                                            <div class="flex items-center space-x-4 mt-2">
                                                <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium"
                                                      th:classappend="${order.type == 'BUY' ? 'bg-green-100 text-green-800' : order.type == 'SELL' ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'}"
                                                      th:text="${order.type}">TYPE</span>
                                                <span class="text-sm text-gray-500" th:text="${order.createdAt}">Date</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-xl font-bold text-gray-900">
                                            <span class="taka-symbol" th:text="${order.price}">0</span>
                                        </p>
                                        <div class="flex items-center space-x-2 mt-2">
                                            <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium"
                                                  th:classappend="${order.status == 'ACTIVE' ? 'bg-green-100 text-green-800' : order.status == 'SOLD' ? 'bg-red-100 text-red-800' : 'bg-yellow-100 text-yellow-800'}"
                                                  th:text="${order.status}">STATUS</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Empty State (shown when no orders) -->
                        <div th:if="${#lists.isEmpty(userOrders)}" class="text-center py-12">
                            <i class="fas fa-shopping-bag text-gray-300 text-5xl mb-4"></i>
                            <h3 class="text-lg font-medium text-gray-900 mb-2">No orders yet</h3>
                            <p class="text-gray-600 mb-4">Start buying, selling, or renting items on CampusCart</p>
                            <button class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors">
                                Browse Items
                            </button>
                        </div>
                    </div>
                </div>
              </div>

              <!-- Username -->
              <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2"
                  >Username</label
                >
                <div class="relative">
                  <input
                    type="text"
                    name="username"
                    th:value="${user.username}"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    placeholder="Enter username"
                  />
                  <i
                    class="fas fa-user absolute right-3 top-3 text-gray-400"
                  ></i>
                </div>
              </div>

              <!-- Location (Hall) -->
              <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2"
                  >Hall/Location</label
                >
                <div class="relative">
                  <select
                    name="location"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent appearance-none bg-white"
                  >
                    <option value="">Select Your Hall</option>
                    <option
                      value="qk_hall"
                      th:selected="${user.location == 'qk_hall'}"
                    >
                      QK Hall
                    </option>
                    <option
                      value="north_hall"
                      th:selected="${user.location == 'north_hall'}"
                    >
                      North Hall
                    </option>
                    <option
                      value="south_hall"
                      th:selected="${user.location == 'south_hall'}"
                    >
                      South Hall
                    </option>
                    <option
                      value="bb_hall"
                      th:selected="${user.location == 'bb_hall'}"
                    >
                      BB Hall
                    </option>
                    <option
                      value="shamshen_nahar_hall"
                      th:selected="${user.location == 'shamshen_nahar_hall'}"
                    >
                      Shamshen Nahar Hall
                    </option>
                    <option
                      value="rabeya_hall"
                      th:selected="${user.location == 'rabeya_hall'}"
                    >
                      Rabeya Hall
                    </option>
                    <option
                      value="sufiya_kamal_hall"
                      th:selected="${user.location == 'sufiya_kamal_hall'}"
                    >
                      Sufiya Kamal Hall
                    </option>
                  </select>
                  <i
                    class="fas fa-map-marker-alt absolute right-3 top-3 text-gray-400 pointer-events-none"
                  ></i>
                </div>
              </div>

              <!-- Password -->
              <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2"
                  >Password</label
                >
                <div class="relative">
                  <input
                    type="password"
                    name="password"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    placeholder="Enter new password"
                  />
                  <i
                    class="fas fa-lock absolute right-3 top-3 text-gray-400"
                  ></i>
                </div>
              </div>

              <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition-colors"
              >
                Update Profile
              </button>
            </form>
          </div>
        </div>

        <script>
            // Enhanced JavaScript for interactivity and filtering
            document.addEventListener('DOMContentLoaded', function() {
                // Add smooth scroll behavior
                document.documentElement.style.scrollBehavior = 'smooth';
                
                // Filter functionality
                const filterButtons = document.querySelectorAll('.filter-btn');
                const orderCards = document.querySelectorAll('.order-card');
                
                filterButtons.forEach(button => {
                    button.addEventListener('click', function() {
                        const filter = this.getAttribute('data-filter');
                        
                        // Update active button
                        filterButtons.forEach(btn => {
                            btn.classList.remove('bg-blue-100', 'text-blue-600', 'font-medium');
                            btn.classList.add('bg-gray-100', 'text-gray-600');
                        });
                        this.classList.remove('bg-gray-100', 'text-gray-600');
                        this.classList.add('bg-blue-100', 'text-blue-600', 'font-medium');
                        
                        // Filter orders
                        orderCards.forEach(card => {
                            const orderType = card.querySelector('[th\\:text="${order.type}"]');
                            if (filter === 'all') {
                                card.style.display = 'block';
                            } else {
                                const type = orderType ? orderType.textContent.toLowerCase() : '';
                                card.style.display = type === filter ? 'block' : 'none';
                            }
                        });
                    });
                });
                
                // Form validation
                const form = document.querySelector('form');
                const emailInput = document.querySelector('input[type="email"]');
                
                if (form && emailInput) {
                    form.addEventListener('submit', function(e) {
                        const email = emailInput.value;
                        if (!email.endsWith('@student.cuet.ac.bd')) {
                            e.preventDefault();
                            alert('Please use your CUET student email address');
                            emailInput.focus();
                        }
                    });
                }
                
                // Add subtle animations to form inputs
                const inputs = document.querySelectorAll('input, select');
                inputs.forEach(input => {
                    input.addEventListener('focus', function() {
                        this.style.transform = 'scale(1.02)';
                        this.style.transition = 'transform 0.2s ease';
                    });
                    
                    input.addEventListener('blur', function() {
                        this.style.transform = 'scale(1)';
                    });
                });
            });
        </script>
    </main>
</body>
</html>
