<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="layout :: head"></head>
  <body th:replace="layout :: layout">
    <main>
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <!-- Profile Information -->
          <div class="lg:col-span-1">
            <div class="bg-primary rounded-2xl p-6 text-white mb-6 shadow-md">
              <div class="text-center">
                <div
                  class="w-24 h-24 bg-white bg-opacity-15 rounded-full mx-auto mb-4 flex items-center justify-center"
                >
                  <i
                    class="fa-solid fa-circle-user text-[6rem] text-[#CFAFAF]"
                  ></i>
                </div>
                <h2
                  class="text-xl font-semibold mb-2"
                  th:text="${user.username != null ? user.username : 'John Doe'}"
                >
                  John Doe
                </h2>
                <p
                  class="text-sm"
                  th:text="${user.email != null ? user.email : 'john.doe@student.cuet.ac.bd'}"
                >
                  john.doe@student.cuet.ac.bd
                </p>
              </div>
            </div>

            <!-- Profile Form -->
            <div class="bg-[#FDF6F0] rounded-2xl shadow-md p-6">
              <h3 class="text-lg font-semibold text-[#5a3b3b] mb-6">
                Profile Information
              </h3>

              <form th:action="@{/profile/update}" method="post">
                <!-- CUET Email -->
                <div class="mb-4">
                  <label class="block text-sm font-medium text-[#5a3b3b] mb-2"
                    >CUET Email</label
                  >
                  <div class="relative">
                    <input
                      type="email"
                      name="email"
                      th:value="${user.email != null ? user.email : ''}"
                      pattern=".*@student\.cuet\.ac\.bd$"
                      title="Please use your CUET student email"
                      class="w-full px-4 py-3 border border-[#BBA2A2] rounded-lg focus:ring-2 focus:ring-[#BBA2A2] focus:border-transparent bg-white text-[#5a3b3b]"
                      placeholder="your.name@student.cuet.ac.bd"
                    />
                    <i
                      class="fas fa-envelope absolute right-3 top-3 text-[#5a3b3b]"
                    ></i>
                  </div>
                </div>

                <!-- Username -->
                <div class="mb-4">
                  <label class="block text-sm font-medium text-[#5a3b3b] mb-2"
                    >Username</label
                  >
                  <div class="relative">
                    <input
                      type="text"
                      name="username"
                      th:value="${user.username != null ? user.username : ''}"
                      class="w-full px-4 py-3 border border-[#BBA2A2] rounded-lg focus:ring-2 focus:ring-[#BBA2A2] focus:border-transparent bg-white text-[#5a3b3b]"
                      placeholder="Enter username"
                    />
                    <i
                      class="fas fa-user absolute right-3 top-3 text-[#5a3b3b]"
                    ></i>
                  </div>
                </div>

                <!-- Location (Hall) -->
                <div class="mb-4">
                  <label class="block text-sm font-medium text-[#5a3b3b] mb-2"
                    >Hall/Location</label
                  >
                  <div class="relative">
                    <select
                      name="location"
                      class="w-full px-4 py-3 border border-[#BBA2A2] rounded-lg focus:ring-2 focus:ring-[#BBA2A2] focus:border-transparent appearance-none bg-white text-[#5a3b3b]"
                    >
                      <option value="">Select Your Hall</option>
                      <option
                        value="qk_hall"
                        th:selected="${user.location != null and user.location == 'qk_hall'}"
                      >
                        QK Hall
                      </option>
                      <option
                        value="north_hall"
                        th:selected="${user.location != null and user.location == 'north_hall'}"
                      >
                        North Hall
                      </option>
                      <option
                        value="south_hall"
                        th:selected="${user.location != null and user.location == 'south_hall'}"
                      >
                        South Hall
                      </option>
                      <option
                        value="bb_hall"
                        th:selected="${user.location != null and user.location == 'bb_hall'}"
                      >
                        BB Hall
                      </option>
                      <option
                        value="shamshen_nahar_hall"
                        th:selected="${user.location != null and user.location == 'shamshen_nahar_hall'}"
                      >
                        Shamshen Nahar Hall
                      </option>
                      <option
                        value="rabeya_hall"
                        th:selected="${user.location != null and user.location == 'rabeya_hall'}"
                      >
                        Rabeya Hall
                      </option>
                      <option
                        value="sufiya_kamal_hall"
                        th:selected="${user.location != null and user.location == 'sufiya_kamal_hall'}"
                      >
                        Sufiya Kamal Hall
                      </option>
                    </select>
                    <i
                      class="fas fa-map-marker-alt absolute right-3 top-3 text-[#5a3b3b] pointer-events-none"
                    ></i>
                  </div>
                </div>

                <!-- Password -->
                <div class="mb-6">
                  <label class="block text-sm font-medium text-[#5a3b3b] mb-2"
                    >Password</label
                  >
                  <div class="relative">
                    <input
                      type="password"
                      name="password"
                      class="w-full px-4 py-3 border border-[#BBA2A2] rounded-lg focus:ring-2 focus:ring-[#BBA2A2] focus:border-transparent bg-white text-[#5a3b3b]"
                      placeholder="Enter new password"
                    />
                    <i
                      class="fas fa-lock absolute right-3 top-3 text-[#5a3b3b]"
                    ></i>
                  </div>
                </div>

                <button
                  type="submit"
                  class="w-full bg-primary hover:bg-[#D4A373] text-white font-semibold py-3 px-4 rounded-lg transition-all shadow-sm"
                >
                  Update Profile
                </button>
              </form>
            </div>
          </div>

          <!-- Orders/Items List -->
          <div class="lg:col-span-2">
            <div class="bg-[#FDF6F0] rounded-2xl shadow-md p-6">
              <div class="flex items-center justify-between mb-6">
                <h3 class="text-lg font-semibold text-[#5a3b3b]">
                  My Orders & Items
                </h3>
                <div class="flex space-x-2">
                  <button
                    class="px-3 py-1 bg-white text-[#BBA2A2] rounded-full text-sm font-medium shadow-sm"
                  >
                    All
                  </button>
                  <button
                    class="px-3 py-1 bg-[#E8D3D3] text-[#5a3b3b] rounded-full text-sm shadow-sm"
                  >
                    Buy
                  </button>
                  <button
                    class="px-3 py-1 bg-[#E8D3D3] text-[#5a3b3b] rounded-full text-sm shadow-sm"
                  >
                    Sell
                  </button>
                  <button
                    class="px-3 py-1 bg-[#E8D3D3] text-[#5a3b3b] rounded-full text-sm shadow-sm"
                  >
                    Rent
                  </button>
                </div>
              </div>

              <!-- Orders List -->
              <div class="space-y-4" th:each="order : ${userOrders}">
                <div
                  class="transition-all duration-300 ease-in-out hover:-translate-y-0.5 hover:shadow-lg bg-white rounded-lg p-4"
                >
                  <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                      <div
                        class="w-16 h-16 bg-[#E8D3D3] rounded-lg flex items-center justify-center shadow-sm"
                      >
                        <i class="fas fa-box text-[#BBA2A2] text-xl"></i>
                      </div>
                      <div>
                        <h4
                          class="font-medium text-[#5a3b3b]"
                          th:text="${order.itemName}"
                        >
                          Item Name
                        </h4>
                        <p
                          class="text-sm text-[#5a3b3b]"
                          th:text="${order.description}"
                        >
                          Description
                        </p>
                        <div class="flex items-center space-x-4 mt-2">
                          <span
                            class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-[#BBA2A2] text-white"
                            th:text="${order.type}"
                            >TYPE</span
                          >
                          <span
                            class="text-sm text-[#5a3b3b]"
                            th:text="${order.createdAt}"
                            >Date</span
                          >
                        </div>
                      </div>
                    </div>
                    <div class="text-right">
                      <p class="text-xl font-bold text-[#5a3b3b]">
                        <span class="ml-0.5">৳</span
                        ><span th:text="${order.price}">0</span>
                      </p>
                      <div class="flex items-center space-x-2 mt-2">
                        <span
                          class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-[#E8D3D3] text-[#5a3b3b]"
                          th:text="${order.status}"
                          >STATUS</span
                        >
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Empty State -->
              <div
                th:if="${#lists.isEmpty(userOrders)}"
                class="text-center py-12"
              >
                <i class="fas fa-shopping-bag text-[#5a3b3b] text-5xl mb-4"></i>
                <h3 class="text-lg font-medium text-[#5a3b3b] mb-2">
                  No orders yet
                </h3>
                <p class="text-[#5a3b3b] mb-4">
                  Start buying, selling, or renting items on CampusCart
                </p>
                <button
                  class="bg-[#BBA2A2] hover:bg-[#CFC0B0] text-white font-semibold py-2 px-4 rounded-lg transition-all shadow-sm"
                >
                  Browse Items
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        document.addEventListener("DOMContentLoaded", function () {
          document.documentElement.style.scrollBehavior = "smooth";
          const form = document.querySelector("form");
          const emailInput = document.querySelector('input[type="email"]');
          if (form && emailInput) {
            form.addEventListener("submit", function (e) {
              const email = emailInput.value;
              if (!email.endsWith("@student.cuet.ac.bd")) {
                e.preventDefault();
                alert("Please use your CUET student email address");
                emailInput.focus();
              }
            });
          }
        });
      </script>
    </main>
  </body>
</html>
