<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout :: head}">
    <title>Sign Up - CampusCart</title>
  </head>
  <body th:replace="~{layout :: layout}">
    <main class="min-h-screen flex items-center justify-center bg-gradient-to-br from-background-light to-primary-50 dark:from-background-dark dark:to-surface-dark py-12">
      <div class="w-full max-w-4xl mx-auto px-4">
        <div class="bg-white dark:bg-surface-dark rounded-2xl shadow-2xl overflow-hidden border border-primary-100/20 dark:border-accent/20">
          <div class="grid grid-cols-1 lg:grid-cols-2">
            <!-- Side Panel -->
            <div class="bg-gradient-to-br from-primary to-accent p-8 lg:p-12 text-white flex flex-col justify-center order-2 lg:order-1">
              <div class="text-center">
                <i data-lucide="graduation-cap" class="h-16 w-16 mx-auto mb-6 text-white/80"></i>
                <h3 class="text-2xl font-bold mb-4">Already a Member?</h3>
                <p class="text-white/90 mb-8 leading-relaxed">
                  Welcome back! Sign in to access your account and continue buying, selling, and connecting with fellow CUETians.
                </p>
                <a
                  href="/signin"
                  class="bg-white text-primary hover:bg-primary-50 font-bold px-8 py-4 rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl inline-block"
                >
                  Sign In
                </a>
              </div>
            </div>

            <!-- Sign Up Form -->
            <div class="p-8 lg:p-12 order-1 lg:order-2">
              <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-primary dark:text-primary-50 mb-2">
                  Join CampusCart
                </h2>
                <p class="text-primary-200 dark:text-primary-100">
                  Create your account and start trading with fellow students
                </p>
              </div>

              <form th:action="@{/signup}" th:object="${user}" method="post" class="space-y-4">
                <!-- Name -->
                <div>
                  <label class="block text-sm font-medium text-primary dark:text-primary-50 mb-2">Full Name</label>
                  <div class="relative">
                    <i data-lucide="user" class="absolute left-3 top-1/2 transform -translate-y-1/2 h-5 w-5 text-primary-200"></i>
                    <input
                      type="text"
                      th:field="*{name}"
                      placeholder="Enter your full name"
                      class="w-full pl-12 pr-4 py-3 border border-primary-100 dark:border-accent/30 rounded-lg focus:ring-2 focus:ring-accent focus:border-accent bg-primary-50 dark:bg-background-dark text-primary dark:text-primary-50 transition-all duration-200"
                      required
                    />
                  </div>
                </div>

                <!-- Username -->
                <div>
                  <label class="block text-sm font-medium text-primary dark:text-primary-50 mb-2">Username</label>
                  <div class="relative">
                    <i data-lucide="at-sign" class="absolute left-3 top-1/2 transform -translate-y-1/2 h-5 w-5 text-primary-200"></i>
                    <input
                      type="text"
                      th:field="*{username}"
                      placeholder="Choose a username"
                      class="w-full pl-12 pr-4 py-3 border border-primary-100 dark:border-accent/30 rounded-lg focus:ring-2 focus:ring-accent focus:border-accent bg-primary-50 dark:bg-background-dark text-primary dark:text-primary-50 transition-all duration-200"
                      required
                    />
                  </div>
                </div>

                <!-- Email -->
                <div>
                  <label class="block text-sm font-medium text-primary dark:text-primary-50 mb-2">CUET Email</label>
                  <div class="relative">
                    <i data-lucide="mail" class="absolute left-3 top-1/2 transform -translate-y-1/2 h-5 w-5 text-primary-200"></i>
                    <input
                      type="email"
                      th:field="*{email}"
                      placeholder="id@student.cuet.ac.bd"
                      class="w-full pl-12 pr-4 py-3 border border-primary-100 dark:border-accent/30 rounded-lg focus:ring-2 focus:ring-accent focus:border-accent bg-primary-50 dark:bg-background-dark text-primary dark:text-primary-50 transition-all duration-200"
                      required
                      pattern="^[a-zA-Z0-9._%+-]+@student\.cuet\.ac\.bd$"
                      title="Only CUET email is allowed"
                    />
                  </div>
                </div>

                <!-- Phone -->
                <div>
                  <label class="block text-sm font-medium text-primary dark:text-primary-50 mb-2">Phone Number</label>
                  <div class="relative">
                    <i data-lucide="phone" class="absolute left-3 top-1/2 transform -translate-y-1/2 h-5 w-5 text-primary-200"></i>
                    <input
                      type="tel"
                      th:field="*{phone}"
                      placeholder="01XXXXXXXXX"
                      class="w-full pl-12 pr-4 py-3 border border-primary-100 dark:border-accent/30 rounded-lg focus:ring-2 focus:ring-accent focus:border-accent bg-primary-50 dark:bg-background-dark text-primary dark:text-primary-50 transition-all duration-200"
                      required
                      pattern="^01[3-9]\d{8}$"
                      title="Enter a valid Bangladeshi phone number"
                    />
                  </div>
                </div>

                <!-- Password -->
                <div>
                  <label class="block text-sm font-medium text-primary dark:text-primary-50 mb-2">Password</label>
                  <div class="relative">
                    <i data-lucide="lock" class="absolute left-3 top-1/2 transform -translate-y-1/2 h-5 w-5 text-primary-200"></i>
                    <input
                      type="password"
                      th:field="*{password}"
                      placeholder="Create a strong password"
                      class="w-full pl-12 pr-4 py-3 border border-primary-100 dark:border-accent/30 rounded-lg focus:ring-2 focus:ring-accent focus:border-accent bg-primary-50 dark:bg-background-dark text-primary dark:text-primary-50 transition-all duration-200"
                      required
                    />
                  </div>
                </div>

                <!-- Confirm Password -->
                <div>
                  <label class="block text-sm font-medium text-primary dark:text-primary-50 mb-2">Confirm Password</label>
                  <div class="relative">
                    <i data-lucide="lock" class="absolute left-3 top-1/2 transform -translate-y-1/2 h-5 w-5 text-primary-200"></i>
                    <input
                      type="password"
                      name="confirmPassword"
                      placeholder="Confirm your password"
                      class="w-full pl-12 pr-4 py-3 border border-primary-100 dark:border-accent/30 rounded-lg focus:ring-2 focus:ring-accent focus:border-accent bg-primary-50 dark:bg-background-dark text-primary dark:text-primary-50 transition-all duration-200"
                      required
                    />
                  </div>
                </div>

                <!-- Error Message -->
                <div th:if="${error}" class="bg-red-100 dark:bg-red-900/30 border border-red-200 dark:border-red-700 text-red-800 dark:text-red-300 p-4 rounded-lg">
                  <p th:text="${error}"></p>
                </div>

                <!-- Submit Button -->
                <button
                  type="submit"
                  class="w-full bg-gradient-to-r from-primary to-accent hover:from-accent hover:to-primary text-white font-bold py-4 rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl"
                >
                  <i data-lucide="user-plus" class="h-5 w-5 inline mr-2"></i>
                  Create Account
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Password Validation Script -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const form = document.querySelector('form');
        const passwordInput = document.querySelector('input[name="password"]');
        const confirmPasswordInput = document.querySelector('input[name="confirmPassword"]');
        
        form.addEventListener('submit', function(e) {
          if (passwordInput.value !== confirmPasswordInput.value) {
            e.preventDefault();
            showMessage('Passwords do not match', 'error');
            confirmPasswordInput.focus();
          }
        });
      });
    </script>
  </body>
</html>
